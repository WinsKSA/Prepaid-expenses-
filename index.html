<title>Muqeem Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations console — fixed left rail of modules, a status bar on top, dense tables in the work area. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e9eeec; --fg:#13201b; --muted:#5a6a64; --line:#d6dedb;
  --accent:#0a6b4d; --accent-fg:#ffffff; --accent-soft:#d8ece4;
  --red:#b8322a; --red-soft:#f7e1df; --amber:#9a5c00; --amber-soft:#f8ebd3; --blue:#2856a8; --blue-soft:#e0e8f7; --green:#1d7a46; --green-soft:#dcefe3;
  --shadow:0 1px 2px rgba(10,30,20,.06),0 8px 24px rgba(10,30,20,.06);
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#141d1a; --surface-2:#1b2622; --fg:#e4ebe8; --muted:#92a29c; --line:#28342f;
  --accent:#3dbb8b; --accent-fg:#05130d; --accent-soft:#163a2d;
  --red:#ff7f72; --red-soft:#3b1d19; --amber:#f1b14e; --amber-soft:#3a2b12; --blue:#82a9ff; --blue-soft:#1a2642; --green:#62d394; --green-soft:#16331f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#141d1a; --surface-2:#1b2622; --fg:#e4ebe8; --muted:#92a29c; --line:#28342f;
  --accent:#3dbb8b; --accent-fg:#05130d; --accent-soft:#163a2d;
  --red:#ff7f72; --red-soft:#3b1d19; --amber:#f1b14e; --amber-soft:#3a2b12; --blue:#82a9ff; --blue-soft:#1a2642; --green:#62d394; --green-soft:#16331f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{display:block;font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;color:var(--fg)}
.nav button small{font-family:var(--f-ar);color:var(--muted);font-size:12px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.badge{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;text-align:center;font-family:var(--f-mono)}

.main{min-width:0;padding-inline:24px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{font-size:20px;flex:1 1 auto;min-width:0}
.top h1 small{font-family:var(--f-ar);font-weight:500;color:var(--muted);font-size:14px;margin-inline-start:8px}
.asof{font-size:12px;color:var(--muted)}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.bell svg{width:16px;height:16px}
.conn{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--surface-2);color:var(--muted)}
.conn.ok{background:var(--green-soft);color:var(--green)}
.conn.bad{background:var(--amber-soft);color:var(--amber)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--line);cursor:pointer;text-align:left}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--f-mono);letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.red{border-top-color:var(--red)} .kpi.red .v{color:var(--red)}
.kpi.amber{border-top-color:var(--amber)} .kpi.amber .v{color:var(--amber)}
.kpi.blue{border-top-color:var(--blue)}
.kpi.green{border-top-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px;display:flex;gap:8px;align-items:baseline}
.panel h2 small{font-family:var(--f-ar);color:var(--muted);font-weight:500;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);position:sticky;top:0}
th .ar{display:block;font-weight:500;font-size:11px}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2)}
tr.clk{cursor:pointer}
.sub{color:var(--muted);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-red{background:var(--red-soft);color:var(--red)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-green{background:var(--green-soft);color:var(--green)}
.p-grey{background:var(--surface-2);color:var(--muted)}

.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .stripe{align-self:stretch;border-radius:2px}
.alert .t{font-weight:600}
.alert .m{color:var(--muted);font-size:12.5px}
.s-expired .stripe{background:var(--red)} .s-critical .stripe{background:var(--red)} .s-warning .stripe{background:var(--amber)} .s-notice .stripe{background:var(--blue)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-family:var(--f-mono);margin-inline-start:4px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field label .ar{margin-inline-start:6px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%}
.field input[readonly]{background:var(--surface-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
input.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0;width:260px;max-width:100%}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 8px}

.overlay{position:fixed;inset:0;background:rgba(5,15,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:16px}
.modal .body{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--surface-2);border-radius:8px;padding:12px}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:11.5px;color:var(--muted)}
.calc b{font-family:var(--f-mono);font-size:15px}

.steps{display:flex;gap:0;flex-wrap:wrap;margin:4px 0}
.step{flex:1 1 110px;padding:8px 10px;border-top:3px solid var(--line);font-size:12px;color:var(--muted)}
.step b{display:block;color:var(--fg);font-size:12.5px}
.step.done{border-top-color:var(--accent)}
.step.cur{border-top-color:var(--amber)}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;max-width:calc(100% - 32px)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
.warnbox{background:var(--amber-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13px}
.okbox{background:var(--green-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.prose{max-width:72ch}
.prose p,.prose li{line-height:1.6}
.prose h3{margin-top:18px;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pipeline button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 8px;text-align:left;cursor:pointer}
.pipeline b{display:block;font-family:var(--f-mono);font-size:20px}
.pipeline span{font-size:11.5px;color:var(--muted)}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;height:auto;z-index:10;padding-block:8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:none}
  .nav{flex-direction:row;overflow-x:auto}
  .nav .grp{display:none}
  .nav button{width:auto;white-space:nowrap}
  .nav button small{display:none}
  .main{padding-inline:16px}
  .top{position:static}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}
}
/* data-viz series (validated categorical order) + status */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#4a3aa7;--st-crit:#d03b3b;--st-serious:#ec835a;--st-warn:#fab219;--st-info:#2a78d6;--st-good:#0ca30c;--grid:#e1e0d9;--axis:#c3c2b7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--st-info:#3987e5;--grid:#2c2c2a;--axis:#383835}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#008300;--s7:#9085e9;--st-info:#3987e5;--grid:#2c2c2a;--axis:#383835}
.enter .kpi,.enter .panel,.enter .tbl-wrap,.enter .pipeline button{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
.enter .kpis .kpi:nth-child(2){animation-delay:.03s}.enter .kpis .kpi:nth-child(3){animation-delay:.06s}.enter .kpis .kpi:nth-child(4){animation-delay:.09s}
.enter .kpis .kpi:nth-child(5){animation-delay:.12s}.enter .kpis .kpi:nth-child(6){animation-delay:.15s}.enter .kpis .kpi:nth-child(7){animation-delay:.18s}.enter .kpis .kpi:nth-child(8){animation-delay:.21s}
@keyframes rise{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.enter .arc{animation:sweep .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes sweep{from{stroke-dasharray:0 1000}}
.enter .line{stroke-dasharray:2000;animation:draw 1.1s ease-out both}
@keyframes draw{from{stroke-dashoffset:2000}to{stroke-dashoffset:0}}
.enter .dot{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.bell.urgent svg{animation:ring 1.8s ease-in-out 2}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-14deg)}}
.kpi{transition:transform .15s,box-shadow .15s}.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
#tip{position:fixed;pointer-events:none;z-index:90;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:6px;padding:6px 9px;font-size:12px;max-width:260px;white-space:pre-line}
.chart [data-tip]{cursor:default}
.chart rect.bar:hover,.chart circle.dot:hover{filter:brightness(1.12)}
.donut-wrap{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.lg-list{display:flex;flex-direction:column;gap:6px;font-size:13px}
.lg-list div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.lg-list i{width:10px;height:10px;border-radius:2px}
.lg-list b{font-family:var(--f-mono)}
@media (max-width:500px){.donut-wrap{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
  <aside class="rail">
    <div class="brand"><b id="brandName">Muqeem Desk</b><span>Iqama · Jawazat · Prepaids</span></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <h1 id="viewTitle">Dashboard</h1>
      <span class="asof" id="asof"></span>
      <span class="conn" id="conn">Connecting…</span>
      <button class="bell" id="bellBtn" aria-label="Open notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="bellCount">0</span>
      </button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="engine.js"></script>
<script src="io.js"></script>
<script>
(function(){
"use strict";
const E = window.Engine, IO = window.IO;
const COLS = ["employees","renewals","visas","contracts"];
const S = {employees:[],renewals:[],visas:[],contracts:[],settings:{},acks:{},loaded:{},ui:{animate:true,view:"dashboard",empQ:"",empStatus:"Active",empAlert:"",renFilter:"Open",visaFilter:"Open",alertCat:"All",amFrom:null,amN:12,amCat:"All",jeMonth:null,rfMonth:null}};
let db=null, user=null, dl=null, uid=null, readOnly=false;

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const h = v => String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => (Number(v)||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const money0 = v => (Number(v)||0).toLocaleString("en-US",{maximumFractionDigits:0});
const fd = d => d ? E.fmtDate(d) : "—";
const hj = d => { if(!d) return ""; try{return E.toHijri(d)||"";}catch(e){return "";} };
const today = () => E.todayISO();
const safeId = id => String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_").replace(/^\.+$/,"_");
function settings(){
  const d=E.DEFAULT_SETTINGS, s=S.settings||{};
  return Object.assign({}, d, s, {accounts:Object.assign({}, d.accounts, s.accounts||{})});
}
function state(){ return {employees:S.employees, renewals:S.renewals, visas:S.visas, contracts:S.contracts}; }
const empBy = no => S.employees.find(e=>e.empNo===no);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#toastRoot").appendChild(t); setTimeout(()=>t.remove(),3200); }
function sevPill(sev,label){ const c={expired:"p-red",critical:"p-red",warning:"p-amber",notice:"p-blue",ok:"p-green"}[sev]||"p-grey"; return `<span class="pill ${c}">${h(label||sev)}</span>`; }
function daysPill(days){
  if(days===""||days==null||isNaN(days)) return `<span class="pill p-grey">—</span>`;
  if(days<0) return `<span class="pill p-red">Expired ${-days}d</span>`;
  if(days<=15) return `<span class="pill p-red">${days}d</span>`;
  if(days<=30) return `<span class="pill p-amber">${days}d</span>`;
  if(days<=90) return `<span class="pill p-blue">${days}d</span>`;
  return `<span class="pill p-green">${days}d</span>`;
}
const STATUS_ORDER=["Requested","HR Approved","Finance Approved","Awaiting Payment","Paid","Completed"];
function statusPill(s){ const c={"Requested":"p-grey","HR Approved":"p-blue","Finance Approved":"p-blue","Awaiting Payment":"p-amber","Paid":"p-amber","Completed":"p-green","Returned":"p-green","Outside KSA":"p-blue","Not Returned":"p-red","Expired Unused":"p-red","Issued":"p-blue","Paid ":"p-amber","Left (Final)":"p-grey"}[s]||"p-grey"; return `<span class="pill ${c}">${h(s)}</span>`; }

/* ---------- data layer ---------- */
async function put(col,id,data){
  if(!db){ // offline preview: keep changes in memory only
    const o=JSON.parse(JSON.stringify(data)); o._id=safeId(id);
    if(col==="config"){ if(id==="settings") S.settings=o; else S.acks=o.items||{}; }
    else { const i=S[col].findIndex(x=>x._id===o._id); if(i>=0) S[col][i]=o; else S[col].push(o); }
    scheduleRender(); return;
  }
  const clean = JSON.parse(JSON.stringify(data));
  clean.updatedAt = new Date().toISOString();
  try{ await db.collection(col).doc(safeId(id)).set(clean); }
  catch(e){
    if(e&&e.code==="unavailable"){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return db.collection(col).doc(safeId(id)).set(clean); }
    if(e&&e.code==="invalid_argument"){ readOnly=true; toast("You have view-only access, so changes cannot be saved."); }
    else if(e&&e.code==="quota_exceeded"){ toast("Storage is full: "+e.message); }
    else toast("Save failed: "+((e&&e.message)||e));
    throw e;
  }
}

const mShort=m=>new Date(m+"T00:00:00Z").toLocaleString("en-US",{month:"short",timeZone:"UTC"});
const mLong=m=>new Date(m+"T00:00:00Z").toLocaleString("en-US",{month:"short",year:"numeric",timeZone:"UTC"});
const kfmt=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(v%1e6?1:0)+"M":Math.abs(v)>=1000?(v/1000).toFixed(v%1000?1:0)+"k":String(Math.round(v));
/* stacked bars: series=[{label,color,values[]}], one y-axis */
function stackedBars(months,series,aria){
  if(!months.length) return `<div class="empty">No data.</div>`;
  const W=680,H=240,pl=44,pb=26,pt=12,pr=6;
  const tot=months.map((_,i)=>series.reduce((a,s)=>a+(s.values[i]||0),0)); const max=Math.max(1,...tot);
  const step=niceStep(max/4), top=Math.ceil(max/step)*step; const y=v=>pt+(H-pt-pb)*(1-v/top); const bw=(W-pl-pr)/months.length;
  let g=""; for(let v=0;v<=top+1e-9;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${kfmt(v)}</text>`;
  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const every=months.length>18?3:months.length>12?2:1;
  const bars=months.map((m,i)=>{ const x=pl+i*bw+bw*.2, w=Math.max(2,bw*.6); let acc=0; let out="";
    const tip=`${mLong(m)}\n`+series.filter(s=>s.values[i]).map(s=>`${s.label}: ${money(s.values[i])}`).join("\n")+`\nTotal: ${money(tot[i])} SAR`;
    const segs=series.map(s=>({c:s.color,v:s.values[i]||0})).filter(s=>s.v>0);
    segs.forEach((s,k)=>{ const y1=y(acc+s.v), y0=y(acc); const hgt=Math.max(0,y0-y1-(k<segs.length-1?0:0)); acc+=s.v;
      out+=`<rect class="bar" style="animation-delay:${i*25}ms" x="${x}" y="${y1+ (k?1:0)}" width="${w}" height="${Math.max(0,hgt-(k?1:0))}" fill="${s.c}" rx="${k===segs.length-1?3:0}" data-tip="${h(tip)}"/>`; });
    if(!segs.length) out+=`<rect x="${x}" y="${pt}" width="${w}" height="${H-pt-pb}" fill="transparent" data-tip="${h(tip)}"/>`;
    return out+(i%every===0?`<text x="${x+w/2}" y="${H-pb+15}" text-anchor="middle">${mShort(m)}</text>`:""); }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(aria)}">${g}${bars}</svg></div>
   ${series.length>1?`<div class="legend" style="flex-wrap:wrap">${series.map(s=>`<span><i style="background:${s.color}"></i>${h(s.label)}</span>`).join("")}</div>`:""}`;
}

    {label:"Rent & contract installments (incl. VAT)",color:"var(--s2)",values:fc.map(m=>m.rentDue||0)}],"Forecast of cash needed per month");
}
function lineChart(months,values,label){
  if(!months.length) return "";
  const W=680,H=170,pl=44,pb=24,pt=14,pr=10; const max=Math.max(1,...values); const step=niceStep(max/3), top=Math.ceil(max/step)*step;
  const x=i=>pl+(W-pl-pr)*(months.length===1?.5:i/(months.length-1)); const y=v=>pt+(H-pt-pb)*(1-v/top);
  let g=""; for(let v=0;v<=top+1e-9;v+=step) g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end">${kfmt(v)}</text>`;
  const pts=values.map((v,i)=>`${x(i)},${y(v)}`).join(" ");
  const area=`${x(0)},${y(0)} ${pts} ${x(values.length-1)},${y(0)}`;
  const every=months.length>18?3:months.length>12?2:1; const last=values.length-1;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${h(label)}">${g}
   <polygon points="${area}" fill="var(--s1)" opacity=".12"/><polyline class="line" points="${pts}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>
   ${values.map((v,i)=>`<circle class="dot" style="animation-delay:${300+i*30}ms" cx="${x(i)}" cy="${y(v)}" r="${i===last?5:3.5}" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" data-tip="${h(mLong(months[i])+"\nClosing prepaid: "+money(v)+" SAR")}"/>`).join("")}

   <text x="${x(last)}" y="${y(values[last])-10}" text-anchor="end" style="fill:var(--fg);font-weight:600">${money0(values[last])}</text></svg></div>`;
}
function donut(segs,center,sub){
  const total=segs.reduce((a,s)=>a+s.v,0); const R=54,C=2*Math.PI*R; let off=0;
  const arcs=total?segs.filter(s=>s.v>0).map(s=>{ const len=C*s.v/total; const gap=segs.filter(x=>x.v>0).length>1?2:0;

    :`<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--grid)" stroke-width="18"/>`;

function expiryStrip(items){
  const W=680,H=120,pl=70,pr=12,max=120; const x=d=>d<0?pl/2:pl+(W-pl-pr)*Math.min(d,max)/max;
  const ticks=[0,15,30,60,90,120];
  const col=d=>d<0?"var(--st-crit)":d<=15?"var(--st-crit)":d<=30?"var(--st-serious)":d<=90?"var(--st-warn)":"var(--st-good)";
  const lanes={}; const dots=items.filter(i=>i.days<=max).sort((a,b)=>a.days-b.days).map((it,k)=>{ const px=Math.round(x(it.days)/9); lanes[px]=(lanes[px]||0)+1; const lane=lanes[px]-1;
    const cy=H-34-((lane%6)*12); return `<circle class="dot" style="animation-delay:${k*20}ms" cx="${it.days<0?14+((k*37)%(pl-36)):x(it.days)}" cy="${cy}" r="5" fill="${col(it.days)}" stroke="var(--surface)" stroke-width="1.5" data-tip="${h(it.name+"\n"+(it.days<0?Math.abs(it.days)+" days overdue":it.days+" days left")+"\nExpiry "+fd(it.date))}"/>`; }).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Iqama expiries in the next 120 days">
   <rect x="4" y="8" width="${pl-14}" height="${H-30}" rx="6" fill="var(--red-soft)"/><text x="${(pl-6)/2}" y="${H-8}" text-anchor="middle" style="fill:var(--red)">Overdue</text>
   ${ticks.map(t=>`<line x1="${x(t)}" x2="${x(t)}" y1="8" y2="${H-22}" stroke="var(--grid)"/><text x="${x(t)}" y="${H-8}" text-anchor="middle">${t===0?"Today":t+"d"}</text>`).join("")}
   <line x1="${pl}" x2="${W-pr}" y1="${H-22}" y2="${H-22}" stroke="var(--axis)"/>${dots}</svg></div>`;
}

const AM_KEYS=[["iqamaExp","Iqama fees","var(--s1)"],["levyExp","Expat levy","var(--s2)"],["wpExp","Work permit","var(--s3)"],["depExp","Dependents","var(--s4)"],["rentExp","Branch rent","var(--s5)"],["insExp","Medical insurance","var(--s6)"],["otherPrepaidExp","Other prepaid","var(--s7)"]];
function amSeries(sch,cat,rows){
  const n=sch.months.length;
  if(cat==="Branch Rent"){ // one series per branch, max 7 then "Other"
    const by={}; rows.forEach(r=>{ const b=r.item.branch||r.item.label; by[b]=by[b]||new Array(n).fill(0); r.byMonth.forEach((v,i)=>by[b][i]+=v||0); });
    const names=Object.keys(by).sort((a,b)=>by[b].reduce((x,y)=>x+y,0)-by[a].reduce((x,y)=>x+y,0));
    const cols=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)"];
    const out=names.slice(0,6).map((b,i)=>({label:b,color:cols[i],values:by[b]}));
    if(names.length>6){ const o=new Array(n).fill(0); names.slice(6).forEach(b=>by[b].forEach((v,i)=>o[i]+=v)); out.push({label:"Other branches",color:cols[6],values:o}); }
    return out;
  }
  const acc={}; AM_KEYS.forEach(([k])=>acc[k]=new Array(n).fill(0));
  rows.forEach(r=>{ const sp=r.item.split||{}; const tot=Object.values(sp).reduce((a,v)=>a+(+v||0),0)||1; Object.keys(sp).forEach(k=>{ if(!acc[k]) acc[k]=new Array(n).fill(0); r.byMonth.forEach((v,i)=>acc[k][i]+=(v||0)*(+sp[k]||0)/tot); }); });
  return AM_KEYS.filter(([k])=>acc[k].some(v=>v>0.004)).map(([k,l,c])=>({label:l,color:c,values:acc[k]}));
}

   <li><b>Renewed.</b> Once Muqeem/Absher shows the new expiry, mark the request renewed. The employee's expiry updates and the next cycle starts.</li>
   <li><b>Month end.</b> Monthly Amortization shows the expense per month. Journal Entries builds the QuickBooks import file and the roll-forward agrees the prepaid balance.</li>
  </ol>

   <li><b>Work permit fee:</b> SAR 100 per year.</li>
   <li><b>Dependents fee:</b> SAR 400 per dependent per month.</li>

async function runImport(dd,gen){
  const btn=$("#imp_go"); btn.disabled=true; const prog=$("#imp_prog"); let done=0; const total=dd.toCreate.length+dd.toUpdate.length;
  await withNumberLock(async()=>{
    const ids=S.employees.map(e=>e.empNo); const pre=settings().empPrefix||"EMP-", pad=settings().empPad||4;
    const jobs=[];
    dd.toCreate.forEach(e=>{ const o=Object.assign({status:"Active",depPayer:"Employee",dependents:0},e);
      if(gen||!o.empNo||ids.includes(o.empNo)){ if(o.empNo&&gen) o.oldEmpNo=o.empNo; o.empNo=E.nextNumber(ids,pre,pad); }
      ids.push(o.empNo); o.createdAt=new Date().toISOString(); jobs.push(["employees",o.empNo,o]); });
    dd.toUpdate.forEach(u=>{ const cur=empBy(u.empNo); if(cur){ const o=Object.assign({},cur,u.changes); delete o._id; jobs.push(["employees",u.empNo,o]); } });
    let i=0; const worker=async()=>{ while(i<jobs.length){ const j=jobs[i++]; for(let a=0;a<4;a++){ try{ await put(...j); break; }catch(e){ if(e&&e.code==="resource_exhausted"){ await new Promise(r=>setTimeout(r,800*(a+1))); } else if(a===3||!(e&&e.code==="unavailable")) break; } } done++; prog.textContent=`${done} / ${total} saved`; } };
    await Promise.all([worker(),worker(),worker(),worker()]);
  });
  toast(`Import finished: ${done} records`); closeModal(); go("employees");
}

  const buf=IO.exportWorkbook([
    {name:"Employees",rows:emp,columns:cols(["empNo","nameEn","nameAr","nationality","jobTitle","department","branch","iqamaNo","iqamaExpiry","effectiveExpiry","hijri","daysLeft","passportNo","passportExpiry","insuranceExpiry","dependents","depPayer","status","levyExempt","phone","email","notes"],{daysLeft:"number",dependents:"number"})},
    {name:"Iqama Renewals",rows:ren,columns:cols(["id","empNo","requestDate","months","oldExpiry","coverageStart","newExpiry","iqamaFee","levy","wpFee","depFee","lateFine","otherFees","total","companyPrepaid","employeeRecoverable","status","hrDate","financeDate","sadadNo","paymentDate","paymentRef","completedDate"],{iqamaFee:"money",levy:"money",wpFee:"money",depFee:"money",lateFine:"money",otherFees:"money",total:"money",companyPrepaid:"money",employeeRecoverable:"money",months:"number",hrDate:"date",financeDate:"date",completedDate:"date",oldExpiry:"date",newExpiry:"date",coverageStart:"date"})},
    {name:"Jawazat",rows:vis,columns:cols(["id","empNo","type","months","fee","payer","requestDate","paymentDate","issueDate","departureDate","returnBefore","returnDate","status","notes"],{fee:"money",months:"number"})},
    {name:"Rent Installments",rows:inst,columns:cols(["contract","category","branch","vendor","refNo","no","periodStart","periodEnd","dueDate","amount","vat","paidDate","paymentRef"],{amount:"money",vat:"money",no:"number",periodStart:"date",periodEnd:"date"})},
    {name:"Amortization",rows:am,columns:[...cols(["item","category","paid","start","end"]),{key:"amount",header:"amount",type:"money"},...sch.months.map(m=>({key:m.slice(0,7),header:m.slice(0,7),type:"money"})),{key:"toDate",header:"amortized to date",type:"money"},{key:"balance",header:"balance",type:"money"}]}
  ]);
  saveFile(`Muqeem-Desk-${t}.xlsx`,buf);
}

/* ---------- modal ---------- */
let modalBtns=[];
function openModal(title,body,btns){
  modalBtns=btns||[];
  $("#modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><header><h3>${h(title)}</h3><button class="btn sm" data-close="1" aria-label="Close">✕</button></header><div class="body">${body}</div>${modalBtns.length?`<footer>${modalBtns.map((b,i)=>`<button class="btn ${b.cls||""}" data-mbtn="${i}" ${readOnly&&b.cls!=="ghost"?"disabled":""}>${h(b.label)}</button>`).join("")}</footer>`:""}</div></div>`;
}
function closeModal(){ $("#modalRoot").innerHTML=""; modalBtns=[]; }
function confirmBox(msg,fn){ openModal("Please confirm",`<p>${h(msg)}</p>`,[{label:"Cancel",fn:closeModal},{label:"Yes, continue",cls:"danger",fn}]); }

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-nav],[data-act],[data-editemp],[data-renewemp],[data-openren],[data-step],[data-renfilter],[data-openvisa],[data-visafilter],[data-editcon],[data-payinst],[data-amcat],[data-alertcat],[data-alertact],[data-goalert],[data-mbtn],[data-close],#bellBtn,#ov");
  if(!t) return;
  if(t.id==="ov"){ if(ev.target.id==="ov") closeModal(); return; }
  if(t.id==="bellBtn") return go("alerts");
  const d=t.dataset;
  if(d.close) return closeModal();
  if(d.mbtn!=null){ const b=modalBtns[+d.mbtn]; if(b&&b.fn){ t.disabled=true; try{ await b.fn(); }catch(e){ console.error(e); } finally{ t.disabled=false; } } return; }
  if(d.renewemp){ ev.stopPropagation(); const open=S.renewals.find(r=>r.empNo===d.renewemp&&E.renewalStatus(r)!=="Completed"); return open?openRenewal(open.id):openRenewal(null,d.renewemp); }
  if(d.step){ ev.stopPropagation(); return openStep(d.step); }
  if(d.payinst){ const [c,n]=d.payinst.split("|"); return payInstallment(c,n); }
  if(d.nav) return go(d.nav);
  if(d.editemp) return openEmployee(d.editemp);
  if(d.openren) return openRenewal(d.openren);
  if(d.renfilter){ S.ui.renFilter=d.renfilter; return S.ui.view==="renewals"?render():go("renewals"); }
  if(d.openvisa) return openVisa(d.openvisa);
  if(d.visafilter){ S.ui.visaFilter=d.visafilter; return render(); }
  if(d.editcon) return openContract(d.editcon);
  if(d.amcat){ S.ui.amCat=d.amcat; return render(); }
  if(d.alertcat){ S.ui.alertCat=d.alertcat; return render(); }
  if(d.goalert){ S.ui.alertCat=d.goalert; return go("alerts"); }
  if(d.alertact){ const a=allAlerts().find(x=>x.key===d.key); if(!a) return;
    if(d.alertact==="copy") return copyText(reminderText(a));
    if(d.alertact==="ack") return setAck(a.key,{ack:true});
    if(d.alertact==="snooze7") return setAck(a.key,{snoozeUntil:E.addDays(today(),7)});
    if(d.alertact==="unmute") return setAck(a.key,null);
    if(d.alertact==="act"){ if(a.category==="Renewal"){ const r=S.renewals.find(x=>x.id===a.ref)||S.renewals.find(x=>x.empNo===a.empNo&&E.renewalStatus(x)!=="Completed"); if(r) return openRenewal(r.id); }
      if(a.category==="Iqama"&&a.empNo) return openRenewal(null,a.empNo);
      if(a.category==="Visa"){ const v=S.visas.find(x=>x.id===a.ref); if(v) return openVisa(v.id); }
      if((a.category==="Rent"||a.category==="Contract")){ const c=S.contracts.find(x=>x.id===a.ref||(a.ref||"").startsWith(x.id)); if(c) return openContract(c.id); return go("contracts"); }
      if(a.empNo) return openEmployee(a.empNo); }
    return; }
  switch(d.act){
    case "addEmp": return openEmployee(null);
    case "addRen": return openRenewal(null);
    case "addVisa": return openVisa(null);
    case "addCon": return openContract(null);
    case "import": return openImport();
    case "template": return saveFile("Employee-import-template.xlsx",IO.employeeTemplate());
    case "export": case "exportAmort": return exportAll();
    case "moreEmp": S.ui.empLimit=1e9; return render();
    case "saveSettings": return saveSettings();
    case "resetSettings": return confirmBox("Restore all fees, reminders and account names to the KSA defaults?",async()=>{ await put("config","settings",{}); closeModal(); toast("Defaults restored"); });
    case "clearExamples": return confirmBox("Delete every record marked Example?",async()=>{ for(const c of COLS){ for(const x of S[c].filter(x=>x.example)) await del(c,x._id||x.id||x.empNo); } closeModal(); toast("Examples removed"); });
    case "copyCSV": case "dlCSV": { const j=E.monthlyJournal(state(),settings(),S.ui.jeMonth,today()); const csv=E.journalCSV(j); if(d.act==="copyCSV") return copyText(csv); return saveFile(`QuickBooks-JE-${S.ui.jeMonth.slice(0,7)}.csv`,"﻿"+csv); }
  }
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(id==="empQ"){ S.ui.empQ=ev.target.value; clearTimeout(window._q); window._q=setTimeout(()=>{ const pos=ev.target.selectionStart; render(); const el=$("#empQ"); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },200); }
});
document.addEventListener("change",ev=>{
  const id=ev.target.id, v=ev.target.value;
  if(id==="empStatus"){ S.ui.empStatus=v; render(); }
  if(id==="empAlert"){ S.ui.empAlert=v; render(); }
  if(id==="amFrom"&&v){ S.ui.amFrom=v+"-01"; render(); }
  if(id==="amN"){ S.ui.amN=+v; render(); }
  if(id==="rfMonth"&&v){ S.ui.rfMonth=v+"-01"; render(); }
  if(id==="jeMonth"&&v){ S.ui.jeMonth=v+"-01"; render(); }
  if(id==="showMuted"){ S.ui.showMuted=ev.target.checked; render(); }
});
const tipEl=document.createElement("div"); tipEl.id="tip"; tipEl.hidden=true; document.body.appendChild(tipEl);
document.addEventListener("mouseover",ev=>{ const t=ev.target.closest&&ev.target.closest("[data-tip]"); if(!t){ tipEl.hidden=true; return; } tipEl.textContent=t.getAttribute("data-tip"); tipEl.hidden=false; });
document.addEventListener("mousemove",ev=>{ if(tipEl.hidden) return; const w=tipEl.offsetWidth, hh=tipEl.offsetHeight; let x=ev.clientX+14, y=ev.clientY+14; if(x+w>innerWidth-8) x=ev.clientX-w-14; if(y+hh>innerHeight-8) y=ev.clientY-hh-14; tipEl.style.left=x+"px"; tipEl.style.top=y+"px"; });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&$("#ov")) closeModal(); });

render(); connect();
})();
</script>
