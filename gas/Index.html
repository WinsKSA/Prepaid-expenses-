  const am=sch.rows.map(r=>{ const o={item:r.item.label,category:r.item.category,paid:r.item.paidDate,start:r.item.start,end:r.item.end,amount:r.item.amount}; sch.months.forEach((m,i)=>o[m.slice(0,7)]=r.byMonth[i]); o.toDate=r.totalToDate; o.balance=r.balance; return o; });
  const cols=(keys,types)=>keys.map(k=>({key:k,header:k,type:(types||{})[k]||(/Date$|Expiry$|^start$|^end$|^paid$|returnBefore|effectiveExpiry/.test(k)?"date":"text")}));
  const buf=IO.exportWorkbook([
    {name:"Employees",rows:emp,columns:cols(["empNo","nameEn","nameAr","nationality","jobTitle","department","branch","iqamaNo","iqamaExpiry","effectiveExpiry","hijri","daysLeft","passportNo","passportExpiry","insuranceExpiry","dependents","depPayer","status","levyExempt","phone","email","notes"],{daysLeft:"number",dependents:"number"})},
    {name:"Iqama Renewals",rows:ren,columns:cols(["id","empNo","requestDate","months","oldExpiry","coverageStart","newExpiry","iqamaFee","levy","wpFee","depFee","lateFine","otherFees","total","companyPrepaid","employeeRecoverable","status","hrDate","financeDate","sadadNo","paymentDate","paymentRef","completedDate"],{iqamaFee:"money",levy:"money",wpFee:"money",depFee:"money",lateFine:"money",otherFees:"money",total:"money",companyPrepaid:"money",employeeRecoverable:"money",months:"number",hrDate:"date",financeDate:"date",completedDate:"date",oldExpiry:"date",newExpiry:"date",coverageStart:"date"})},
    {name:"Jawazat",rows:vis,columns:cols(["id","empNo","type","months","fee","payer","requestDate","paymentDate","issueDate","departureDate","returnBefore","returnDate","status","notes"],{fee:"money",months:"number"})},
    {name:"Rent Installments",rows:inst,columns:cols(["contract","category","branch","vendor","refNo","no","periodStart","periodEnd","dueDate","amount","vat","paidDate","paymentRef"],{amount:"money",vat:"money",no:"number",periodStart:"date",periodEnd:"date"})},
    {name:"Amortization",rows:am,columns:[...cols(["item","category","paid","start","end"]),{key:"amount",header:"amount",type:"money"},...sch.months.map(m=>({key:m.slice(0,7),header:m.slice(0,7),type:"money"})),{key:"toDate",header:"amortized to date",type:"money"},{key:"balance",header:"balance",type:"money"}]}
  ]);
  saveFile(`Muqeem-Desk-${t}.xlsx`,buf);
}

/* ---------- Google Sheets sync (mirror of every record, written through the viewer's Google Sheets connector) ---------- */
const GS="Google Sheets";
let mcpNs=null, gsTimer=null, gsBusy=false, gsAgain=false; S.gs={state:"",msg:"",at:""};
function gsId(){ const v=String(settings().gsheet||"").trim(); const m=v.match(/\/d\/([A-Za-z0-9_-]{20,})/); return m?m[1]:(/^[A-Za-z0-9_-]{20,}$/.test(v)?v:""); }
function setGs(state,msg){ S.gs={state,msg:msg||"",at:state==="ok"?new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}):S.gs.at}; const el=$("#gsChip"); if(el){ el.hidden=!gsId(); el.className="conn "+(state==="ok"?"ok":state==="error"?"bad":""); el.textContent=state==="ok"?`Google Sheets ✓ ${S.gs.at}`:state==="syncing"?"Google Sheets: syncing…":state==="error"?"Google Sheets: not synced":"Google Sheets"; el.title=msg||""; } }
const cell=v=>v==null?"":(typeof v==="number"||typeof v==="string"||typeof v==="boolean")?v:JSON.stringify(v);
function gsTables(){
  const st=settings(), t=today();
  const tab=(title,cols,rows)=>({title,rows:[cols.map(c=>c[0]),...rows.map(r=>cols.map(c=>cell(typeof c[1]==="function"?c[1](r):r[c[1]])))]});
  const emp=S.employees.map(e=>Object.assign({},e,{eff:E.effectiveExpiry(e,S.renewals)}));
  const ren=S.renewals.map(r=>{ let c={}; try{c=E.calcRenewal(r,empBy(r.empNo)||{},st,S.renewals,t);}catch(x){} return Object.assign({},r,c,{status:E.renewalStatus(r)}); });
  const vis=S.visas.map(v=>Object.assign({},v,{fee:(()=>{try{return E.visaFee(v,st,S.visas);}catch(x){return 0;}})(),rb:E.visaReturnBefore(v),status:E.visaStatus(v,t)}));
  const inst=[]; S.contracts.forEach(c=>(c.installments||[]).forEach(i=>inst.push(Object.assign({cid:c.id,branch:c.branch},i))));
  inst.sort((a,b)=>(a.dueDate||"").localeCompare(b.dueDate||""));
  return [
    tab("Employees",[["Emp No","empNo"],["HR No","hrNo"],["Name (AR)","nameAr"],["Name (EN)","nameEn"],["Gender","gender"],["Nationality","nationality"],["Iqama No","iqamaNo"],["National ID","nationalId"],["Iqama expiry (last known)","iqamaExpiry"],["Effective expiry","eff"],["Hijri","iqamaExpiryHijri"],["Days left",r=>r.eff?E.daysBetween(t,r.eff):""],["Iqama fees by","iqamaFeesBy"],["Profession","jobTitle"],["Department","department"],["Branch","branch"],["Labour office file","molFile"],["Passport No","passportNo"],["Passport expiry","passportExpiry"],["Insurance expiry","insuranceExpiry"],["Dependents","dependents"],["Dependents fee by","depPayer"],["Status","status"],["Mobile","phone"],["Notes","notes"]],[...emp].sort((a,b)=>a.empNo.localeCompare(b.empNo))),
    tab("Iqama Renewals",[["Request","id"],["Emp No","empNo"],["Request date","requestDate"],["Months","months"],["Current expiry","oldExpiry"],["New expiry","newExpiry"],["Iqama fee","iqamaFee"],["Levy","levy"],["Work permit","wpFee"],["Dependents fee","depFee"],["Late fine","lateFine"],["Other","otherFees"],["Total","total"],["Company prepaid","companyPrepaid"],["Status","status"],["HR approval","hrDate"],["Finance approval","financeDate"],["SADAD no","sadadNo"],["Payment date","paymentDate"],["Payment ref","paymentRef"],["Renewed","completedDate"],["Notes","notes"]],ren),
    tab("Jawazat",[["Ref","id"],["Emp No","empNo"],["Service","type"],["Months","months"],["Fee","fee"],["Paid by","payer"],["Request date","requestDate"],["Payment date","paymentDate"],["Issue date","issueDate"],["Departure","departureDate"],["Return before","rb"],["Returned","returnDate"],["Status","status"],["Notes","notes"]],vis),
    tab("Leases",[["Lease","id"],["Category","category"],["Branch","branch"],["Landlord","vendor"],["Ejar / ref","refNo"],["Start","startDate"],["End","endDate"],["Value excl. VAT","totalAmount"],["Frequency","frequency"],["VAT","vatApplicable"],["Model",c=>leaseModel(c)],["Notice days","noticeDays"],["City","city"],["Area m²","areaSqm"],["Notes","notes"]],S.contracts),
    tab("Rent Installments",[["Lease","cid"],["Branch","branch"],["No","no"],["Due","dueDate"],["Period start","periodStart"],["Period end","periodEnd"],["Amount excl. VAT","amount"],["VAT","vat"],["Total",r=>Math.round(((+r.amount||0)+(+r.vat||0))*100)/100],["Paid date","paidDate"],["Payment ref","paymentRef"]],inst)
  ];
}
async function gsSync(manual){
  if(db&&db.gas){ if(gsBusy){ gsAgain=true; return; } gsBusy=true; setGs("syncing"); try{ await db.run("writeViews",gsTables()); setGs("ok"); if(manual) toast("Google Sheet updated"); }catch(e){ setGs("error",e.message); if(manual) toast("Sheet update failed: "+e.message); } finally{ gsBusy=false; if(gsAgain){ gsAgain=false; gsSoon(); } } return; }
  if(!gsId()){ if(manual) toast("Add your Google Sheet link under Fees & Settings first."); return; }
  if(gsBusy){ gsAgain=true; return; }
  if(!mcpNs){ try{ mcpNs=window.claude&&await window.claude.use("mcp"); }catch(e){ mcpNs=null; } }
  if(!mcpNs){ setGs("error","Google Sheets isn't available in this view."); if(manual) toast("Google Sheets isn't available in this view."); return; }
  gsBusy=true; setGs("syncing");
  try{
    const id=gsId(), tabs=gsTables(); let have=null;
    try{ const m=await mcpNs.callTool(GS,"get_spreadsheet",{spreadsheetId:id,fields:["sheets.properties.title"]},{cache:false}); const p=m&&m.payload; have=new Set(((p&&p.sheets)||[]).map(s=>s.properties&&s.properties.title)); }catch(e){ if(e&&(e.code==="needs_reauth"||e.code==="server_not_connected"||e.code==="not_in_manifest"||e.code==="denied")) throw e; }
    for(const t of tabs){ if(have&&have.has(t.title)) continue; try{ await mcpNs.callTool(GS,"update_spreadsheet",{spreadsheetId:id,requests:[{addSheet:{properties:{title:t.title,gridProperties:{frozenRowCount:1}}}}]}); }catch(e){} }
    await mcpNs.callTool(GS,"batch_clear_values",{spreadsheetId:id,ranges:tabs.map(t=>`'${t.title}'!A:Z`)});
    for(const t of tabs) await mcpNs.callTool(GS,"update_values",{spreadsheetId:id,range:`'${t.title}'!A1`,values:t.rows});
    setGs("ok"); if(manual) toast("Google Sheet updated");
  }catch(e){
    const msg=e&&e.code==="needs_reauth"?"Reconnect Google Sheets in claude.ai Settings → Connectors.":e&&e.code==="server_not_connected"?"Connect Google Sheets in claude.ai Settings → Connectors.":e&&(e.code==="denied"||e.code==="not_granted")?"Allow Google Sheets for this page to sync.":((e&&e.message)||"Sync failed.");
    setGs("error",msg); if(manual) toast(msg);
  }finally{ gsBusy=false; if(gsAgain){ gsAgain=false; gsSoon(); } }
}
function gsSoon(){ if(!db||(!db.gas&&!gsId())) return; clearTimeout(gsTimer); gsTimer=setTimeout(()=>gsSync(false),6000); }

/* ---------- modal ---------- */
let modalBtns=[];
function openModal(title,body,btns){
  modalBtns=btns||[];
  $("#modalRoot").innerHTML=`<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true" aria-label="${h(title)}"><header><h3>${h(title)}</h3><button class="btn sm" data-close="1" aria-label="Close">✕</button></header><div class="body">${body}</div>${modalBtns.length?`<footer>${modalBtns.map((b,i)=>`<button class="btn ${b.cls||""}" data-mbtn="${i}" ${readOnly&&b.cls!=="ghost"?"disabled":""}>${h(b.label)}</button>`).join("")}</footer>`:""}</div></div>`;
}
function closeModal(){ $("#modalRoot").innerHTML=""; modalBtns=[]; }
function confirmBox(msg,fn){ openModal("Please confirm",`<p>${h(msg)}</p>`,[{label:"Cancel",fn:closeModal},{label:"Yes, continue",cls:"danger",fn}]); }

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-nav],[data-act],[data-editemp],[data-renewemp],[data-openren],[data-step],[data-renfilter],[data-openvisa],[data-visafilter],[data-editcon],[data-lease],[data-lact],[data-profile],[data-loan],[data-letter],[data-leavef],[data-leaveact],[data-eosb],[data-payinst],[data-amcat],[data-alertcat],[data-alertact],[data-goalert],[data-mbtn],[data-close],[data-lang],#bellBtn,#ov");
  if(!t) return;
  if(t.id==="ov"){ if(ev.target.id==="ov") closeModal(); return; }
  if(t.id==="bellBtn") return go("alerts");
  if(t.dataset.lang){ const was=I18N.lang; if(was===t.dataset.lang) return; if(t.dataset.lang==="en"){ try{localStorage.setItem("mqd-lang","en");}catch(e){} location.reload(); return; } I18N.set(t.dataset.lang); return; }
  const d=t.dataset;
  if(d.close){ closeModal(); if(!d.nav) return; }
  if(d.mbtn!=null){ const b=modalBtns[+d.mbtn]; if(b&&b.fn){ t.disabled=true; try{ await b.fn(); }catch(e){ console.error(e); } finally{ t.disabled=false; } } return; }
  if(d.renewemp){ ev.stopPropagation(); const open=S.renewals.find(r=>r.empNo===d.renewemp&&E.renewalStatus(r)!=="Completed"); return open?openRenewal(open.id):openRenewal(null,d.renewemp); }
  if(d.step){ ev.stopPropagation(); return openStep(d.step); }
  if(d.payinst){ const [c,n]=d.payinst.split("|"); return payInstallment(c,n); }
  if(d.nav) return go(d.nav);
  if(d.editemp) return openEmployee(d.editemp);
  if(d.openren) return openRenewal(d.openren);
  if(d.renfilter){ S.ui.renFilter=d.renfilter; return S.ui.view==="renewals"?render():go("renewals"); }
  if(d.openvisa) return openVisa(d.openvisa);
  if(d.visafilter){ S.ui.visaFilter=d.visafilter; return render(); }
  if(d.editcon) return openContract(d.editcon);
  if(d.lease) return openLease(d.lease);
  if(d.profile){ closeModal(); return openProfile(d.profile); }
  if(d.loan) return openLoan(d.loan);
  if(d.letter){ const [k,n]=d.letter.split("|"); closeModal(); return makeLetter(k,n); }
  if(d.lact){ const [k,i]=d.lact.split("|"); closeModal(); return leaseAction(k,i); }
  if(d.leavef){ S.ui.leaveF=d.leavef; return render(); }
  if(d.eosb) return openEOSB(d.eosb);
  if(d.leaveact){ const [st,id]=d.leaveact.split("|"); const l=S.leaves.find(x=>x.id===id); if(!l) return; const o=Object.assign({},l,{status:st,decidedAt:new Date().toISOString(),decidedBy:uid||""}); delete o._id; await put("leaves",id,o); toast(`${id}: ${st.toLowerCase()}`); return; }
  if(d.amcat){ S.ui.amCat=d.amcat; return render(); }
  if(d.alertcat){ S.ui.alertCat=d.alertcat; return render(); }
  if(d.goalert){ S.ui.alertCat=d.goalert; return go("alerts"); }
  if(d.alertact){ const a=allAlerts().find(x=>x.key===d.key); if(!a) return;
    if(d.alertact==="copy") return copyText(reminderText(a));
    if(d.alertact==="ack") return setAck(a.key,{ack:true});
    if(d.alertact==="snooze7") return setAck(a.key,{snoozeUntil:E.addDays(today(),7)});
    if(d.alertact==="unmute") return setAck(a.key,null);
    if(d.alertact==="act"){ if(a.category==="Renewal"){ const r=S.renewals.find(x=>x.id===a.ref)||S.renewals.find(x=>x.empNo===a.empNo&&E.renewalStatus(x)!=="Completed"); if(r) return openRenewal(r.id); }
      if(a.category==="Iqama"&&a.empNo) return openRenewal(null,a.empNo);
      if(a.category==="Visa"){ const v=S.visas.find(x=>x.id===a.ref); if(v) return openVisa(v.id); }
      if((a.category==="Rent"||a.category==="Contract")){ const c=S.contracts.find(x=>x.id===a.ref||(a.ref||"").startsWith(x.id)); if(c) return openContract(c.id); return go("contracts"); }
      if(a.empNo) return openEmployee(a.empNo); }
    return; }
  switch(d.act){
    case "more": return openMore();
    case "addLeave": return openLeave();
    case "addLoan": return openLoan(null);
    case "hrImport": return openHrImport();
    case "paySave": case "payLock": { const pid=S.ui.payM.slice(0,7); const cur=S.payruns.find(r=>r.id===pid)||{}; const inputs=S.ui.payInputs||cur.inputs||{}; const o={id:pid,inputs,status:d.act==="payLock"?"LOCKED":"DRAFT",updatedBy:uid||""}; if(d.act==="payLock"){ o.run=payrollRunNow(); o.lockedAt=new Date().toISOString(); } await put("payruns",pid,o); S.ui.payInputs=null; toast(d.act==="payLock"?"Payroll locked":"Inputs saved"); return; }
    case "payUnlock": return confirmBox("Unlock this payroll month? It will recalculate from current data.",async()=>{ const pid=S.ui.payM.slice(0,7); const cur=S.payruns.find(r=>r.id===pid)||{}; const o=Object.assign({},cur,{status:"DRAFT"}); delete o._id; delete o.run; await put("payruns",pid,o); closeModal(); });
    case "payMudad": { const H=HRX(); const pid=S.ui.payM.slice(0,7); const sv=S.payruns.find(r=>r.id===pid); const run=sv&&sv.status==="LOCKED"?sv.run:payrollRunNow(); return saveFile(`Mudad-WPS-${pid}.csv`,"\ufeff"+H.mudadCSV(run,hrCfg(),{name:settings().company,molNo:settings().molNo,crNo:settings().crNo})); }
    case "payJE": { const H=HRX(); const pid=S.ui.payM.slice(0,7); const sv=S.payruns.find(r=>r.id===pid); const run=sv&&sv.status==="LOCKED"?sv.run:payrollRunNow(); return saveFile(`Payroll-JE-${pid}.csv`,"\ufeff"+E.journalCSV(H.payrollJournal(run,hrCfg()))); }
    case "gsSync": return gsSync(true);
    case "addEmp": return openEmployee(null);
    case "addRen": return openRenewal(null);
    case "addVisa": return openVisa(null);
    case "addCon": return openContract(null);
    case "import": return openImport();
    case "template": return saveFile("Employee-import-template.xlsx",IO.employeeTemplate());
    case "export": case "exportAmort": return exportAll();
    case "moreEmp": S.ui.empLimit=1e9; return render();
    case "showNoExp": S.ui.empAlert="none"; S.ui.empStatus="Active"; return go("employees");
    case "saveSettings": return saveSettings();
    case "resetSettings": return confirmBox("Restore all fees, reminders and account names to the KSA defaults?",async()=>{ await put("config","settings",{}); closeModal(); toast("Defaults restored"); });
    case "clearExamples": return confirmBox("Delete every record marked Example?",async()=>{ for(const c of COLS){ for(const x of S[c].filter(x=>x.example)) await del(c,x._id||x.id||x.empNo); } closeModal(); toast("Examples removed"); });
    case "copyCSV": case "dlCSV": { const j=fullJournal(S.ui.jeMonth); const csv=E.journalCSV(j); if(d.act==="copyCSV") return copyText(csv); return saveFile(`QuickBooks-JE-${S.ui.jeMonth.slice(0,7)}.csv`,"﻿"+csv); }
  }
});
document.addEventListener("input",ev=>{
  const id=ev.target.id;
  if(id==="empQ"){ S.ui.empQ=ev.target.value; clearTimeout(window._q); window._q=setTimeout(()=>{ const pos=ev.target.selectionStart; render(); const el=$("#empQ"); if(el){ el.focus(); el.setSelectionRange(pos,pos);} },200); }
});
document.addEventListener("change",ev=>{
  const id=ev.target.id, v=ev.target.value;
  if(id==="empStatus"){ S.ui.empStatus=v; render(); }
  if(id==="empAlert"){ S.ui.empAlert=v; render(); }
  if(id==="empFees"){ S.ui.empFees=v; render(); }
  if(id==="amFrom"&&v){ S.ui.amFrom=v+"-01"; render(); }
  if(id==="amN"){ S.ui.amN=+v; render(); }
  if(id==="rfMonth"&&v){ S.ui.rfMonth=v+"-01"; render(); }
  if(id==="jeMonth"&&v){ S.ui.jeMonth=v+"-01"; render(); }
  if(id==="payM"&&v){ S.ui.payM=v+"-01"; S.ui.payInputs=null; render(); }
  if(ev.target.classList&&ev.target.classList.contains("payin")){ const pid=S.ui.payM.slice(0,7); const base=S.ui.payInputs||JSON.parse(JSON.stringify(((S.payruns.find(r=>r.id===pid)||{}).inputs)||{})); const em=ev.target.dataset.emp,k=ev.target.dataset.k; base[em]=Object.assign({},base[em]||{},{[k]:parseFloat(v)||0}); S.ui.payInputs=base; render(); }
  if(id==="showMuted"){ S.ui.showMuted=ev.target.checked; render(); }
});
const tipEl=document.createElement("div"); tipEl.id="tip"; tipEl.hidden=true; document.body.appendChild(tipEl);
document.addEventListener("mouseover",ev=>{ const t=ev.target.closest&&ev.target.closest("[data-tip]"); if(!t){ tipEl.hidden=true; return; } tipEl.textContent=t.getAttribute("data-tip"); tipEl.hidden=false; });
document.addEventListener("mousemove",ev=>{ if(tipEl.hidden) return; const w=tipEl.offsetWidth, hh=tipEl.offsetHeight; let x=ev.clientX+14, y=ev.clientY+14; if(x+w>innerWidth-8) x=ev.clientX-w-14; if(y+hh>innerHeight-8) y=ev.clientY-hh-14; tipEl.style.left=x+"px"; tipEl.style.top=y+"px"; });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&$("#ov")) closeModal(); });

window.__rerender=render; if(window.I18N) I18N.start(); render(); connect();
})();
