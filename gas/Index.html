<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Muqeem Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: operations console — fixed left rail of modules, a status bar on top, dense tables in the work area. */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --surface-2:#e9eeec; --fg:#13201b; --muted:#5a6a64; --line:#d6dedb;
  --accent:#0a6b4d; --accent-fg:#ffffff; --accent-soft:#d8ece4;
  --red:#b8322a; --red-soft:#f7e1df; --amber:#9a5c00; --amber-soft:#f8ebd3; --blue:#2856a8; --blue-soft:#e0e8f7; --green:#1d7a46; --green-soft:#dcefe3;
  --shadow:0 1px 2px rgba(10,30,20,.06),0 8px 24px rgba(10,30,20,.06);
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1412; --surface:#141d1a; --surface-2:#1b2622; --fg:#e4ebe8; --muted:#92a29c; --line:#28342f;
  --accent:#3dbb8b; --accent-fg:#05130d; --accent-soft:#163a2d;
  --red:#ff7f72; --red-soft:#3b1d19; --amber:#f1b14e; --amber-soft:#3a2b12; --blue:#82a9ff; --blue-soft:#1a2642; --green:#62d394; --green-soft:#16331f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1412; --surface:#141d1a; --surface-2:#1b2622; --fg:#e4ebe8; --muted:#92a29c; --line:#28342f;
  --accent:#3dbb8b; --accent-fg:#05130d; --accent-soft:#163a2d;
  --red:#ff7f72; --red-soft:#3b1d19; --amber:#f1b14e; --amber-soft:#3a2b12; --blue:#82a9ff; --blue-soft:#1a2642; --green:#62d394; --green-soft:#16331f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.45}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding-block:16px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:0 18px 14px;border-bottom:1px solid var(--line);margin-bottom:8px}
.brand b{display:block;font-size:17px;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px;padding:0 8px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;color:var(--fg)}
.nav button small{font-family:var(--f-ar);color:var(--muted);font-size:12px}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:14px 10px 4px}
.badge{min-width:20px;padding:1px 6px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:600;text-align:center;font-family:var(--f-mono)}

.main{min-width:0;padding-inline:24px;padding-block:0 48px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.top h1{font-size:20px;flex:1 1 auto;min-width:0}
.top h1 small{font-family:var(--f-ar);font-weight:500;color:var(--muted);font-size:14px;margin-inline-start:8px}
.asof{font-size:12px;color:var(--muted)}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center}
.bell svg{width:16px;height:16px}
.conn{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--surface-2);color:var(--muted)}
.conn.ok{background:var(--green-soft);color:var(--green)}
.conn.bad{background:var(--amber-soft);color:var(--amber)}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-top:3px solid var(--line);cursor:pointer;text-align:left}
.kpi .v{font-size:26px;font-weight:600;font-family:var(--f-mono);letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.red{border-top-color:var(--red)} .kpi.red .v{color:var(--red)}
.kpi.amber{border-top-color:var(--amber)} .kpi.amber .v{color:var(--amber)}
.kpi.blue{border-top-color:var(--blue)}
.kpi.green{border-top-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h2{font-size:15px;margin-bottom:12px;display:flex;gap:8px;align-items:baseline}
.panel h2 small{font-family:var(--f-ar);color:var(--muted);font-weight:500;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}
th{background:var(--surface-2);font-weight:600;font-size:12px;color:var(--muted);position:sticky;top:0}
th .ar{display:block;font-weight:500;font-size:11px}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
tfoot td{font-weight:600;background:var(--surface-2)}
tr.clk{cursor:pointer}
.sub{color:var(--muted);font-size:12px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-red{background:var(--red-soft);color:var(--red)}
.p-amber{background:var(--amber-soft);color:var(--amber)}
.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-green{background:var(--green-soft);color:var(--green)}
.p-grey{background:var(--surface-2);color:var(--muted)}

.alert{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .stripe{align-self:stretch;border-radius:2px}
.alert .t{font-weight:600}
.alert .m{color:var(--muted);font-size:12.5px}
.s-expired .stripe{background:var(--red)} .s-critical .stripe{background:var(--red)} .s-warning .stripe{background:var(--amber)} .s-notice .stripe{background:var(--blue)}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip b{font-family:var(--f-mono);margin-inline-start:4px}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
.field label .ar{margin-inline-start:6px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 9px;width:100%}
.field input[readonly]{background:var(--surface-2)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
input.search{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px;min-width:0;width:260px;max-width:100%}
select.sel{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 8px}

.overlay{position:fixed;inset:0;background:rgba(5,15,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);border:1px solid var(--line)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:16px}
.modal .body{padding:18px;display:flex;flex-direction:column;gap:16px}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;background:var(--surface-2);border-radius:8px;padding:12px}
.calc div{display:flex;flex-direction:column}
.calc span{font-size:11.5px;color:var(--muted)}
.calc b{font-family:var(--f-mono);font-size:15px}

.steps{display:flex;gap:0;flex-wrap:wrap;margin:4px 0}
.step{flex:1 1 110px;padding:8px 10px;border-top:3px solid var(--line);font-size:12px;color:var(--muted)}
.step b{display:block;color:var(--fg);font-size:12.5px}
.step.done{border-top-color:var(--accent)}
.step.cur{border-top-color:var(--amber)}

.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:80;max-width:calc(100% - 32px)}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
.warnbox{background:var(--amber-soft);color:var(--fg);border-radius:8px;padding:10px 12px;font-size:13px}
.okbox{background:var(--green-soft);border-radius:8px;padding:10px 12px;font-size:13px}
.prose{max-width:72ch}
.prose p,.prose li{line-height:1.6}
.prose h3{margin-top:18px;font-size:15px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.pipeline{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pipeline button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:10px 8px;text-align:left;cursor:pointer}
.pipeline b{display:block;font-family:var(--f-mono);font-size:20px}
.pipeline span{font-size:11.5px;color:var(--muted)}

/* ===== Redesign layer: ink rail + paper work area; phone = bottom tabs + cards + sheets ===== */
:root{--f-display:"Readex Pro","IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --rail:#0f1f19;--rail-2:#1a3128;--rail-fg:#dfe9e4;--rail-muted:#87a196;--gold:#a8782a;--gold-soft:#f4e9d3;--paper:#f6f8f7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--rail:#070d0b;--rail-2:#13241d;--rail-fg:#dfe9e4;--rail-muted:#7d958b;--gold:#dcae55;--gold-soft:#2e2412;--paper:#0f1714}}
:root[data-theme="dark"]{--rail:#070d0b;--rail-2:#13241d;--rail-fg:#dfe9e4;--rail-muted:#7d958b;--gold:#dcae55;--gold-soft:#2e2412;--paper:#0f1714}
body{background:var(--paper)}
h1,h2,h3,.kpi .v,.brand b,.pipeline b{font-family:var(--f-display)}
.shell{grid-template-columns:248px minmax(0,1fr)}
.rail{background:var(--rail);color:var(--rail-fg);border-right:0;padding-block:20px 16px;display:flex;flex-direction:column}
.brand{display:flex;gap:11px;align-items:center;border-bottom:1px solid rgba(255,255,255,.07);padding:0 18px 18px}
.brand .mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(140deg,#1f6b4f,#0b3a2b);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.brand .mark svg{width:22px;height:22px;color:#f1d79c}
.brand b{color:#fff;font-size:17px;font-weight:600}
.brand span{color:var(--rail-muted);font-size:11.5px}
.nav button{color:var(--rail-fg);padding:8px 10px;border-radius:9px;justify-content:flex-start;position:relative}
.nav button .ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--rail-muted)}
.nav button .ico svg{width:18px;height:18px}
.nav button .lbl{flex:1;min-width:0;line-height:1.25}
.nav button small{color:var(--rail-muted)}
.nav button:hover{background:var(--rail-2)}
.nav button[aria-current="true"]{background:var(--rail-2);color:#fff;font-weight:600}
.nav button[aria-current="true"] .ico{background:var(--gold);color:#1a1205}
.nav .grp{color:var(--rail-muted);opacity:.85}
.rail-foot{margin-top:auto;padding:14px 18px 0;font-size:11.5px;color:var(--rail-muted);border-top:1px solid rgba(255,255,255,.07)}
.main{padding-inline:28px}
.top{background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-block:16px}
.top h1{font-size:24px;font-weight:600;letter-spacing:-.01em}
.datechip{display:flex;align-items:center;gap:9px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 11px 5px 8px}
.datechip svg{width:18px;height:18px;color:var(--gold)}
.datechip b{display:block;font-size:12.5px;font-weight:600;line-height:1.2}
.datechip span{display:block;font-size:11.5px;color:var(--muted);font-family:var(--f-ar);line-height:1.2}
.bell{border-radius:10px;padding:8px 11px}
.kpi,.kpi.red,.kpi.amber,.kpi.blue,.kpi.green{border:1px solid var(--line);border-radius:14px;padding:16px 18px;gap:6px}
.kpi .v{font-size:30px;font-weight:600}
.kpi .l{font-size:12.5px}
.kpi .tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .tag i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.kpi.red .tag i{background:var(--red)}.kpi.amber .tag i{background:var(--amber)}.kpi.blue .tag i{background:var(--blue)}.kpi.green .tag i{background:var(--accent)}
.kpi.green .v{color:var(--accent)}
.panel{border-radius:14px;padding:18px}
.panel h2{font-size:15.5px;font-weight:600}
.tbl-wrap{border-radius:12px}
th{background:var(--surface-2)}
.btn{border-radius:9px}
.only-mob{display:none}
.tabbar,.fab{display:none}
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;width:100%;cursor:pointer}
.mcard .t{font-weight:600;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.mcard .s{grid-column:1/-1;color:var(--muted);font-size:12.5px;display:flex;gap:6px 12px;flex-wrap:wrap}
.mcard .r{justify-self:end;align-self:start}
.mcard .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
/* tablet: icon rail */
@media (max-width:1100px) and (min-width:761px){
  .shell{grid-template-columns:76px minmax(0,1fr)}
  .brand{padding:0 0 16px;justify-content:center}.brand>div{display:none}
  .nav .grp{display:none}.nav{padding:0 10px;gap:6px}
  .nav button{justify-content:center;padding:6px}.nav button .lbl{display:none}
  .nav button .badge{position:absolute;top:0;right:2px}
  .rail-foot{display:none}
  .grid3{grid-template-columns:minmax(0,1fr)}
}
/* phone: bottom tabs, cards, sheets */
@media (max-width:760px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
  .top{gap:8px;padding-block:12px;margin-bottom:14px}
  .top h1{font-size:20px;flex-basis:100%;order:-1}
  .top h1 small{display:block;margin:0}
  .conn{display:none}
  .datechip{flex:1}
  .grid2,.grid3{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:13px 14px}.kpi .v{font-size:24px}
  .pipeline{grid-template-columns:repeat(3,minmax(0,1fr))}
  .only-desk{display:none!important}
  .only-mob{display:block}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;font-size:11px;color:var(--muted);position:relative;cursor:pointer}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
  .tabbar button[aria-current="true"] .tico{background:var(--accent-soft)}
  .tabbar .tico{width:46px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
  .tabbar .badge{position:absolute;top:2px;left:calc(50% + 6px)}
  .fab{display:grid;place-items:center;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-fg);border:0;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:41;cursor:pointer}
  .fab[hidden]{display:none!important}
  .fab svg{width:26px;height:26px}
  .overlay{align-items:flex-end;padding:0}
  .modal{border-radius:20px 20px 0 0;max-height:94vh;display:flex;flex-direction:column;animation:sheet .32s cubic-bezier(.2,.8,.2,1)}
  .modal .body{overflow:auto;padding-bottom:20px}
  .modal footer{padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
  .modal footer .btn{flex:1}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .chip{flex:none}
  input.search{width:100%}
  .alert{grid-template-columns:4px minmax(0,1fr)}
  .alert>.row{grid-column:2}
}
.linkish{border:0;background:none;padding:0;color:var(--fg);font:inherit;cursor:pointer;text-align:start}.linkish:hover{color:var(--accent);text-decoration:underline}
ul.org,ul.org ul{list-style:none;margin:0;padding-inline-start:18px;border-inline-start:1px dashed var(--line)}ul.org{border:0;padding:0}ul.org li{padding:4px 0}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
/* ===== Language: Arabic (RTL) ===== */
.langsw{display:flex;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:3px;gap:2px}

<script>/* engine.js */
/* Iqama & Jawazat Control System - calculation engine (vanilla JS, ES2018, no deps) */
(function (root) {
  'use strict';

  var DEFAULT_SETTINGS = {
    company: "Company name", crNo: "", molNo: "",
    empPrefix: "EMP-", empPad: 4,
    iqamaFeeYear: 650,
    levyMonth: 800,
    wpFeeYear: 100,
    depFeeMonth: 400,
    lateFine1: 500, lateFine2: 1000,
    lateGraceDays: 3,
    erSingleBase: 200, erSingleBaseMonths: 2, erSingleAddMonth: 100,
    erMultiBase: 500, erMultiBaseMonths: 3, erMultiAddMonth: 200,
    finalExitFee: 0, iqamaLostFee: 1000, iqamaLostFee2: 2000, iqamaDamagedFee: 300, erUnusedFine: 1000,
    reminderDays: [90, 60, 30, 15, 7, 0],
    passportMinDays: 90, passportAlertDays: 180, insuranceAlertDays: 30,
    accounts: {
      bank: "Bank - Al Rajhi",
      prepaid: "Prepaid Government Fees",
      iqamaExp: "Iqama Fees Expense",
      levyExp: "Work Permit Levy Expense",
      wpExp: "Work Permit Fees Expense",
      depExp: "Dependents Fees Expense",
      visaExp: "Exit Re-entry Visa Expense",
      finesExp: "Government Penalties (Non-deductible)",
      otherExp: "Other Government Fees",
      empRecv: "Employee Receivable",
      prepaidRent: "Prepaid Rent",
      rentExp: "Rent Expense",
      prepaidIns: "Prepaid Medical Insurance",
      insExp: "Medical Insurance Expense",
      prepaidOther: "Prepaid Expenses - Other",
      otherPrepaidExp: "Other Expense",
      inputVat: "VAT Input (Recoverable)"
    },
    vatRate: 0.15,
    contractReminderDays: [90, 60, 30],
    installmentReminderDays: [30, 14, 7, 0]
  };

  var DAY = 86400000;
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  // expense account -> prepaid account
  var PREPAID_OF = { iqamaExp: "prepaid", levyExp: "prepaid", wpExp: "prepaid", depExp: "prepaid",
    rentExp: "prepaidRent", insExp: "prepaidIns", otherPrepaidExp: "prepaidOther" };
  var PREPAID_ACCOUNTS = ["prepaid", "prepaidRent", "prepaidIns", "prepaidOther"];
  var EXP_ORDER = ["iqamaExp", "levyExp", "wpExp", "depExp", "rentExp", "insExp", "otherPrepaidExp"];

  function round2(x) {
    x = Number(x) || 0;
    var r = Math.round(Math.abs(x) * 100 + 1e-7) / 100;
    r = x < 0 ? -r : r;
    return r === 0 ? 0 : r;
  }
  function num(x) { var n = Number(x); return isFinite(n) ? n : 0; }
  function pad(n, w) { var s = String(n); while (s.length < w) s = "0" + s; return s; }
  function S(settings) {
    var s = Object.assign({}, DEFAULT_SETTINGS, settings || {});
    s.accounts = Object.assign({}, DEFAULT_SETTINGS.accounts, (settings && settings.accounts) || {});
    return s;
  }
  function maxISO(a, b) { if (!a) return b || ""; if (!b) return a; return a > b ? a : b; }

  // ---------- dates ----------
  function parseISO(s) {
    if (typeof s !== "string") return NaN;
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s);
    if (!m) return NaN;
    var y = +m[1], mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1) return NaN;
    var ms = Date.UTC(y, mo - 1, d);
    var dt = new Date(ms);
    if (dt.getUTCMonth() !== mo - 1 || dt.getUTCDate() !== d) return NaN;
    return ms;
  }
  function iso(ms) {
    if (typeof ms !== "number" || !isFinite(ms)) return "";
    var d = new Date(ms);
    return pad(d.getUTCFullYear(), 4) + "-" + pad(d.getUTCMonth() + 1, 2) + "-" + pad(d.getUTCDate(), 2);
  }
  function valid(s) { return !isNaN(parseISO(s)); }
  function addDays(s, n) { var ms = parseISO(s); return isNaN(ms) ? "" : iso(ms + Math.round(num(n)) * DAY); }
  function addMonths(s, n) {
    var ms = parseISO(s); if (isNaN(ms)) return "";
    var d = new Date(ms);
    var y = d.getUTCFullYear(), m = d.getUTCMonth() + Math.round(num(n)), day = d.getUTCDate();
    var ty = y + Math.floor(m / 12), tm = ((m % 12) + 12) % 12;
    var last = new Date(Date.UTC(ty, tm + 1, 0)).getUTCDate();
    return iso(Date.UTC(ty, tm, Math.min(day, last)));
  }
  function daysBetween(a, b) {
    var x = parseISO(a), y = parseISO(b);
    if (isNaN(x) || isNaN(y)) return NaN;
    return Math.round((y - x) / DAY);
  }
  function monthStart(s) { return valid(s) ? s.slice(0, 8) + "01" : ""; }
  function monthEnd(s) {
    var ms = parseISO(s); if (isNaN(ms)) return "";
    var d = new Date(ms);
    return iso(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0));
  }
  function todayISO() {
    var d = new Date();
    return pad(d.getFullYear(), 4) + "-" + pad(d.getMonth() + 1, 2) + "-" + pad(d.getDate(), 2);
  }
  function toHijri(s) {
    var ms = parseISO(s); if (isNaN(ms)) return "";
    try {
      var f = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",
        { timeZone: "UTC", day: "2-digit", month: "2-digit", year: "numeric" });
      var parts = f.formatToParts(new Date(ms)), o = {};
      parts.forEach(function (p) { o[p.type] = p.value; });
      var y = String(o.year || o.relatedYear || "").replace(/[^0-9]/g, "");
      var dd = String(o.day || "").replace(/[^0-9]/g, ""), mm = String(o.month || "").replace(/[^0-9]/g, "");
      if (!y || !dd || !mm) return "";
      return pad(dd, 2) + "/" + pad(mm, 2) + "/" + y;
    } catch (e) { return ""; }
  }
  function fmtDate(s) {
    var ms = parseISO(s); if (isNaN(ms)) return "";
    var d = new Date(ms);
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear();
  }
  function dmy(s) { return valid(s) ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : ""; }

  // ---------- ids ----------
  function nextNumber(existingIds, prefix, padW) {
    prefix = prefix || ""; padW = padW == null ? 4 : padW;
    var max = 0;
    (existingIds || []).forEach(function (id) {
      if (typeof id !== "string" || id.indexOf(prefix) !== 0) return;
      var rest = id.slice(prefix.length);
      if (/^\d+$/.test(rest)) max = Math.max(max, parseInt(rest, 10));
    });
    return prefix + pad(max + 1, padW);
  }

  // ---------- renewals ----------
  function renewalStatus(r) {
    if (!r) return "";
    if (r.completedDate) return "Completed";
    if (r.paymentDate) return "Paid";
    if (r.sadadNo) return "Awaiting Payment";
    if (r.financeDate) return "Finance Approved";
    if (r.hrDate) return "HR Approved";
    return "Requested";
  }
  function renNewExpiry(r) { return valid(r.oldExpiry) ? addMonths(r.oldExpiry, num(r.months)) : ""; }
  function effectiveExpiry(emp, renewals) {
    var e = (emp && emp.iqamaExpiry) || "";
    (renewals || []).forEach(function (r) {
      if (r.empNo === emp.empNo && r.completedDate) e = maxISO(e, renNewExpiry(r));
    });
    return e;
  }
  function suggestOldExpiry(emp, renewals, excludeId) {
    var e = (emp && emp.iqamaExpiry) || "";
    (renewals || []).forEach(function (r) {
      if (r.empNo === emp.empNo && r.id !== excludeId) e = maxISO(e, renNewExpiry(r));
    });
    return e;
  }
  function isEarlier(a, b) { // a earlier than b
    var ad = a.requestDate || "", bd = b.requestDate || "";
    if (ad !== bd) return ad < bd;
    return String(a.id || "") < String(b.id || "");
  }
  function renewalLate(r, oldExpiry, settings, today) {
    if (!valid(oldExpiry)) return false;
    var d = r.paymentDate || today || todayISO();
    return d > addDays(oldExpiry, num(settings.lateGraceDays));
  }
  function calcRenewal(r, emp, settings, allRenewals, today) {
    var s = S(settings); emp = emp || {}; allRenewals = allRenewals || []; today = today || todayISO();
    var m = num(r.months);
    var oldExpiry = valid(r.oldExpiry) ? r.oldExpiry : suggestOldExpiry(emp, allRenewals, r.id);
    var coverageStart = addDays(oldExpiry, 1);
    var newExpiry = addMonths(oldExpiry, m);
    var coverageDays = valid(newExpiry) ? daysBetween(coverageStart, newExpiry) + 1 : 0;
    var deps = (r.dependentsAtRequest !== undefined && r.dependentsAtRequest !== null && r.dependentsAtRequest !== "")
      ? num(r.dependentsAtRequest) : num(emp.dependents);
    var payer = r.depPayerAtRequest || emp.depPayer || "Company";
    var iqamaFee = round2(num(s.iqamaFeeYear) * m / 12);
    var levy = round2((emp.levyExempt ? 0 : num(s.levyMonth)) * m);
    var wpFee = round2(num(s.wpFeeYear) * m / 12);
    var depFee = round2(deps * num(s.depFeeMonth) * m);
    var isLate = renewalLate(r, oldExpiry, s, today);
    var offenseNo = 0;
    if (isLate) {
      var earlier = 0;
      allRenewals.forEach(function (o) {
        if (o === r || o.id === r.id || o.empNo !== r.empNo || !isEarlier(o, r)) return;
        var oe = valid(o.oldExpiry) ? o.oldExpiry : suggestOldExpiry(emp, allRenewals, o.id);
        if (renewalLate(o, oe, s, today)) earlier++;
      });
      offenseNo = earlier + 1;
    }
    var lateFine = !isLate ? 0 : (offenseNo === 1 ? num(s.lateFine1) : num(s.lateFine2));
    var otherFees = round2(num(r.otherFees));
    var compDep = payer === "Employee" ? 0 : depFee;
    var companyPrepaid = round2(iqamaFee + levy + wpFee + compDep);
    var employeeRecoverable = payer === "Employee" ? depFee : 0;
    var expensedNow = round2(lateFine + otherFees);
    return {
      oldExpiry: oldExpiry, coverageStart: coverageStart, newExpiry: newExpiry, coverageDays: coverageDays,
      iqamaFee: iqamaFee, levy: levy, wpFee: wpFee, depFee: depFee, depPayer: payer, dependents: deps,
      isLate: isLate, offenseNo: offenseNo, deportRisk: offenseNo >= 3, lateFine: lateFine,
      otherFees: otherFees, companyPrepaid: companyPrepaid, employeeRecoverable: employeeRecoverable,
      expensedNow: expensedNow, total: round2(companyPrepaid + employeeRecoverable + expensedNow),
      components: { iqama: iqamaFee, levy: levy, wp: wpFee, dep: compDep }
    };
  }

  // ---------- visas ----------
  function isER(v) { return v && (v.type === "ER Single" || v.type === "ER Multiple"); }
  function visaReturnBefore(v) {
    if (!isER(v) || !valid(v.issueDate)) return "";
    return addMonths(v.issueDate, num(v.months));
  }
  function visaStatus(v, today) {
    today = today || todayISO();
    if (!v) return "";
    if (v.type === "Final Exit") {
      if (v.departureDate) return "Left (Final)";
      if (v.issueDate) return "Issued";
      if (v.paymentDate) return "Paid";
      return "Requested";
    }
    if (isER(v)) {
      var rb = visaReturnBefore(v);
      var past = rb && today > rb;
      if (v.returnDate) return "Returned";
      if (v.departureDate) return past ? "Not Returned" : "Outside KSA";
      if (v.issueDate) return past ? "Expired Unused" : "Issued";
      if (v.paymentDate) return "Paid";
      return "Requested";
    }
    if (v.issueDate) return "Issued";
    if (v.paymentDate) return "Paid";
    return "Requested";
  }
  function visaFee(v, settings, allVisas) {
    var s = S(settings), m = num(v.months);
    switch (v.type) {
      case "ER Single": return round2(num(s.erSingleBase) + Math.max(0, m - num(s.erSingleBaseMonths)) * num(s.erSingleAddMonth));
      case "ER Multiple": return round2(num(s.erMultiBase) + Math.max(0, m - num(s.erMultiBaseMonths)) * num(s.erMultiAddMonth));
      case "Final Exit": return round2(num(s.finalExitFee));
      case "Iqama Damaged": return round2(num(s.iqamaDamagedFee));
      case "Iqama Lost":
        var prior = (allVisas || []).filter(function (o) {
          return o !== v && o.id !== v.id && o.empNo === v.empNo && o.type === "Iqama Lost" && isEarlier(o, v);
        }).length;
        return round2(prior === 0 ? num(s.iqamaLostFee) : num(s.iqamaLostFee2));
      default: return 0;
    }
  }

  // ---------- contracts ----------
  var FREQ_MONTHS = { "Annual": 12, "Semi-annual": 6, "Quarterly": 3, "Monthly": 1 };
  function buildInstallments(contract, settings) {
    var s = S(settings), c = contract || {};
    var start = c.startDate, end = c.endDate;
    if (!valid(start) || !valid(end) || end < start) return [];
    var n = FREQ_MONTHS[c.frequency] || 12;
    var total = num(c.totalAmount);
    var contractDays = daysBetween(start, end) + 1;
    var existing = {};
    (c.installments || []).forEach(function (i) { existing[i.no] = i; });
    var out = [], k = 0;
    while (true) {
      var ps = addMonths(start, k * n);
      if (ps > end) break;
      var pe = addDays(addMonths(start, (k + 1) * n), -1);
      if (pe > end) pe = end;
      out.push({ no: k + 1, periodStart: ps, periodEnd: pe });
      k++;
      if (k > 1200) break;
    }
    var sum = 0;
    out.forEach(function (it, idx) {
      var amt;
      if (idx === out.length - 1) amt = round2(total - sum);
      else { amt = round2(total * (daysBetween(it.periodStart, it.periodEnd) + 1) / contractDays); sum = round2(sum + amt); }
      var ex = existing[it.no] || {};
      it.dueDate = (ex.dueDate && ex.periodStart === it.periodStart) ? ex.dueDate : it.periodStart;
      it.amount = amt;
      it.vat = c.vatApplicable ? round2(amt * num(s.vatRate)) : 0;
      it.paidDate = ex.paidDate || "";
      it.paymentRef = ex.paymentRef || "";
    });
    return out;
  }
  function contractExpKey(c) {
    return c.category === "Branch Rent" ? "rentExp" : c.category === "Medical Insurance" ? "insExp" : "otherPrepaidExp";
  }

  // ---------- prepaid items & amortization ----------
  function prepaidItems(state, settings, today) {
    var s = S(settings); state = state || {}; today = today || todayISO();
    var emps = {}; (state.employees || []).forEach(function (e) { emps[e.empNo] = e; });
    var renewals = state.renewals || [], items = [];
    renewals.forEach(function (r) {
      if (!valid(r.paymentDate)) return;
      var emp = emps[r.empNo] || { empNo: r.empNo };
      var c = calcRenewal(r, emp, s, renewals, today);
      if (!(c.companyPrepaid > 0) || !valid(c.coverageStart) || !valid(c.newExpiry)) return;
      var split = { iqamaExp: c.iqamaFee, levyExp: c.levy, wpExp: c.wpFee };
      if (c.components.dep > 0) split.depExp = c.components.dep;
      items.push({
        key: "renewal:" + r.id, source: "renewal", refId: r.id,
        label: r.id + " " + (emp.nameEn || r.empNo) + " (" + num(r.months) + "m)",
        empNo: r.empNo, category: "Iqama Renewal", paidDate: r.paymentDate,
        start: c.coverageStart, end: c.newExpiry, amount: c.companyPrepaid, split: split, prepaidAccount: "prepaid"
      });
    });
    (state.contracts || []).forEach(function (con) {

      var w = round2(num(h.basic) + num(h.housing) + num(h.transport)), wt, why;
      var documented = h.qiwaDocumented !== false && n.qiwaDocumented !== false;
      if (!documented) { wt = 0; why = "not documented on Qiwa"; }
      else if ((h.disabled || n.disabled) && w >= cfg.saudizationHalfBelow && disabledUsed < disabledCap) { wt = num(cfg.nitaqatDisabledWeight); disabledUsed++; why = "disabled"; }
      else if (h.student || n.student || h.partTime || n.partTime) { wt = num(cfg.nitaqatPartWeight); why = "student / part-time"; }
      else if (w >= cfg.saudizationHalfBelow) { wt = 1; why = "wage >= " + cfg.saudizationHalfBelow; }
      else if (w >= cfg.saudizationZeroBelow) { wt = 0.5; why = "wage below " + cfg.saudizationHalfBelow; }
      else { wt = 0; why = "wage below " + cfg.saudizationZeroBelow; }
      sw += wt;
      rows.push({ empNo: e.empNo, saudi: true, wage: w, weight: wt, reason: why });
    });
    var total = sw + expats;
    return { saudiWeighted: sw, expats: expats, total: total, pct: total ? round2(sw / total * 100) : 0, rows: rows, estimate: true };
  }
  function headcount(emps) {
    var r = { total: 0, active: 0, byNationality: {}, byDepartment: {}, byGender: {}, byStatus: {} };
    function inc(m, k) { k = k || "Unknown"; m[k] = (m[k] || 0) + 1; }
    (emps || []).forEach(function (e) {

      inc(r.byGender, e.gender);
    });

  }

    eosb: eosb, eosbProvision: eosbProvision, leaveBalance: leaveBalance, sickPay: sickPay, leaveDays: leaveDays,

<script>
/* Language layer: translates rendered text nodes + attributes when Arabic is on; flips the page to RTL. */
(function(){
  let lang="en"; try{ lang=localStorage.getItem("mqd-lang")||((navigator.language||"").startsWith("ar")?"ar":"en"); }catch(e){}
  const D=()=>window.I18N_AR||{exact:{},patterns:[]};
  let pats=null; const compiled=()=>pats||(pats=(D().patterns||[]).map(([re,to])=>{ try{ return [new RegExp("^"+re+"$"),to]; }catch(e){ return null; } }).filter(Boolean));
  function tr(s){
    const t=s.trim(); if(!t||!/[A-Za-z]/.test(t)) return null;
    const ex=D().exact||{}; let out=ex[t];
    if(out==null){ for(const [re,to] of compiled()){ if(re.test(t)){ out=t.replace(re,to); break; } } }
    if(out==null) return null;
    return s.replace(t,out);
  }
  function walk(root){
    if(lang!=="ar"||!root) return;
    if(root.nodeType===3){ const v=tr(root.nodeValue); if(v!=null&&v!==root.nodeValue) root.nodeValue=v; return; }
    if(root.nodeType!==1) return;
    if(root.closest&&root.closest("script,style,.no-tr,.mono,.chart text")) return;
    ["placeholder","title","aria-label","data-tip"].forEach(a=>{ if(root.hasAttribute&&root.hasAttribute(a)){ const v=tr(root.getAttribute(a)); if(v!=null) root.setAttribute(a,v); } });
    const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT,{acceptNode(n){
      if(n.nodeType===1){ if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.tagName)||n.classList.contains("no-tr")) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_SKIP; }
      return NodeFilter.FILTER_ACCEPT; }});
    let n; const nodes=[]; while((n=tw.nextNode())) nodes.push(n);
    nodes.forEach(t=>{ const v=tr(t.nodeValue); if(v!=null&&v!==t.nodeValue) t.nodeValue=v; });
    root.querySelectorAll&&root.querySelectorAll("[placeholder],[title],[aria-label],[data-tip],option").forEach(el=>{
      ["placeholder","title","aria-label","data-tip"].forEach(a=>{ if(el.hasAttribute(a)){ const v=tr(el.getAttribute(a)); if(v!=null) el.setAttribute(a,v); } });
    });
  }
  function apply(){
    document.documentElement.lang=lang; document.documentElement.dir=lang==="ar"?"rtl":"ltr";
    document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  }
  const mo=new MutationObserver(ms=>{ if(lang!=="ar") return; ms.forEach(m=>{ if(m.type==="characterData") walk(m.target); else m.addedNodes.forEach(walk); }); });
  window.I18N={ get lang(){return lang;}, tr:s=>lang==="ar"?(tr(s)||s):s,
    set(l){ lang=l; try{ localStorage.setItem("mqd-lang",l); }catch(e){} apply(); if(window.__rerender) window.__rerender(); if(l==="ar") walk(document.body); },
    start(){ apply(); mo.observe(document.body,{childList:true,subtree:true,characterData:true}); walk(document.body); } };
})();

  g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--axis)"/>`;
  const every=months.length>18?3:months.length>12?2:1;
  const bars=months.map((m,i)=>{ const x=pl+i*bw+bw*.2, w=Math.max(2,bw*.6); let acc=0; let out="";

function donut(segs,center,sub){

    :`<circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--grid)" stroke-width="18"/>`;
  return `<div class="donut-wrap"><div class="chart"><svg viewBox="0 0 150 150" role="img" aria-label="Iqama status breakdown">${arcs}

}
function expiryStrip(items){

  const c=Object.assign({category:"Branch Rent",frequency:"Annual",vatApplicable:true,startDate:E.monthStart(today()),endDate:E.addDays(E.addMonths(E.monthStart(today()),12),-1),totalAmount:0},c0||{});
  const anyPaid=(c.installments||[]).some(i=>i.paidDate);
  openModal(isNew?"New prepaid contract · عقد جديد":`Contract ${c0.id}`,`<div class="fgrid">
    <div class="field"><label for="c_cat">Category</label><select id="c_cat">${["Branch Rent","Medical Insurance","Licenses (Baladiya / Civil Defense / CR)","Software & Subscriptions","Maintenance Contracts","Advertising","Other"].map(x=>`<option ${c.category===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="c_branch">Branch<span class="ar">الفرع</span></label><input id="c_branch" value="${h(c.branch||"")}" placeholder="Riyadh — Olaya"></div>
    <div class="field"><label for="c_vendor">Landlord / vendor<span class="ar">المؤجر</span></label><input id="c_vendor" value="${h(c.vendor||"")}"></div>
    <div class="field"><label for="c_ref">Ejar / policy no<span class="ar">رقم عقد إيجار</span></label><input id="c_ref" value="${h(c.refNo||"")}"></div>
    <div class="field"><label for="c_start">Start date</label><input id="c_start" type="date" value="${h(c.startDate)}"></div>
    <div class="field"><label for="c_end">End date</label><input id="c_end" type="date" value="${h(c.endDate)}"></div>
    <div class="field"><label for="c_total">Contract value excl. VAT (SAR)</label><input id="c_total" type="number" step="0.01" min="0" value="${h(c.totalAmount)}"></div>
    <div class="field"><label for="c_freq">Payment frequency</label><select id="c_freq">${["Annual","Semi-annual","Quarterly","Monthly"].map(x=>`<option ${c.frequency===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="c_vat">VAT 15%</label><select id="c_vat"><option value="1" ${c.vatApplicable?"selected":""}>Yes — landlord VAT registered</option><option value="0" ${!c.vatApplicable?"selected":""}>No VAT</option></select></div>
    <div class="field"><label for="c_notes">Notes</label><input id="c_notes" value="${h(c.notes||"")}"></div>
    <div class="field"><label for="c_model">Accounting model</label><select id="c_model">${[["auto","Company default"],["prepaid","Prepaid"],["straightline","Straight-line"],["ifrs16","IFRS 16"]].map(([v,l])=>`<option value="${v}" ${(c.model||"auto")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="c_ibr">Incremental borrowing rate</label><input id="c_ibr" type="number" step="0.0001" value="${h(c.ibr!=null?c.ibr:(st.defaultIbr||0.065))}"></div>
    <div class="field"><label for="c_notice">Notice period (days)</label><input id="c_notice" type="number" min="0" value="${h(c.noticeDays!=null?c.noticeDays:90)}"></div>
    <div class="field"><label for="c_city">City</label><input id="c_city" value="${h(c.city||"")}"></div>
    <div class="field"><label for="c_ptype">Property type</label><select id="c_ptype">${["Shop","Drive-thru","Lounge","Cafe","Office","Warehouse","Staff housing","Other"].map(x=>`<option ${c.propertyType===x?"selected":""}>${x}</option>`).join("")}</select></div>
    <div class="field"><label for="c_area">Area (m²)</label><input id="c_area" type="number" min="0" value="${h(c.areaSqm||"")}"></div>
    <div class="field"><label for="c_dep">Security deposit (SAR)</label><input id="c_dep" type="number" min="0" step="0.01" value="${h(c.securityDeposit||0)}"></div>
    <div class="field"><label for="c_phone">Landlord phone</label><input id="c_phone" value="${h(c.landlordPhone||"")}"></div>
    <div class="field"><label for="c_lcr">Landlord CR / ID</label><input id="c_lcr" value="${h((c.landlord||{}).crNo||"")}"></div>
    <div class="field"><label for="c_lvat">Landlord VAT number</label><input id="c_lvat" value="${h((c.landlord||{}).vatNo||"")}"></div>
    <div class="field"><label for="c_liban">Landlord IBAN</label><input id="c_liban" value="${h((c.landlord||{}).iban||"")}"></div>
    <div class="field"><label for="c_deed">Title deed no</label><input id="c_deed" value="${h((c.property||{}).deedNo||"")}"></div>
    <div class="field"><label for="c_dist">District</label><input id="c_dist" value="${h((c.property||{}).district||"")}"></div>
    <div class="field"><label for="c_act">Activity / licence</label><input id="c_act" value="${h((c.property||{}).activity||"")}"></div>
    <div class="field"><label for="c_esc">Rent escalation</label><select id="c_esc">${[["none","None"],["fixed_pct","Fixed % per year"],["fixed_amount","Fixed amount per year"],["cpi","CPI-linked (% estimate)"]].map(([v,l])=>`<option value="${v}" ${((c.escalation||{}).type||"none")===v?"selected":""}>${l}</option>`).join("")}</select></div>
    <div class="field"><label for="c_escp">Escalation % or amount</label><input id="c_escp" type="number" step="0.01" value="${h((c.escalation||{}).pct||(c.escalation||{}).amount||"")}"></div>
    <div class="field"><label for="c_rff">Rent-free from</label><input id="c_rff" type="date" value="${h(((c.rentFree||[])[0]||{}).from||"")}"></div>
    <div class="field"><label for="c_rft">Rent-free to</label><input id="c_rft" type="date" value="${h(((c.rentFree||[])[0]||{}).to||"")}"></div>
    <div class="field"><label for="c_ren">Renewal option (years)</label><input id="c_ren" type="number" min="0" value="${h(((c.options||{}).renewal||{}).years||"")}"></div>
    <div class="field"><label for="c_tpen">Early termination penalty (SAR)</label><input id="c_tpen" type="number" min="0" step="0.01" value="${h(((c.options||{}).termination||{}).penalty||"")}"></div></div>
    ${anyPaid?`<div class="warnbox">Some installments are already paid. Changing the dates, value or frequency rebuilds unpaid installments. Payment dates on matching installment numbers are kept.</div>`:""}
    <div id="c_prev"></div>`,
   [c0?{label:"Delete",cls:"danger",fn:()=>confirmBox(`Delete contract ${c0.id} and its schedule?`,async()=>{await del("contracts",c0.id);closeModal();})}:null,
    {label:"Save",cls:"pri",fn:async()=>{ const o=readCon(c); if(!o.branch){toast("Enter the branch.");return;} if(!(o.totalAmount>0)){toast("Enter the contract value.");return;} if(!(o.endDate>o.startDate)){toast("The end date must be after the start date.");return;}
      o.installments = o.customSchedule ? (c.installments||[]) : (window.Rental&&o.escalation&&o.escalation.type!=="none"||(o.rentFree||[]).length ? window.Rental.generateSchedule(o,st).map((x,i)=>Object.assign({paidDate:"",paymentRef:""},(c.installments||[]).find(y=>y.no===x.no)||{},x)) : E.buildInstallments(o,st));
      if(isNew){ await withNumberLock(async()=>{ o.id=nextId("CON-",S.contracts); await put("contracts",o.id,o); }); toast(`Saved as ${o.id}`);} else { await put("contracts",o.id,o); toast("Saved"); } closeModal(); }}].filter(Boolean));
  const upd=()=>{ const o=readCon(c); let ins=[]; try{ ins=E.buildInstallments(o,st);}catch(x){}
    $("#c_prev").innerHTML=ins.length?`<div class="sub" style="margin-bottom:6px">Installment schedule preview</div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>Period</th><th>Due</th><th class="n">Amount</th><th class="n">VAT</th><th class="n">Monthly amortization</th></tr></thead><tbody>${ins.map(i=>`<tr><td>${i.no}</td><td>${fd(i.periodStart)} → ${fd(i.periodEnd)}</td><td>${fd(i.dueDate)}</td><td class="n">${money(i.amount)}</td><td class="n">${money(i.vat)}</td><td class="n">≈ ${money(i.amount/Math.max(1,Math.round(E.daysBetween(i.periodStart,i.periodEnd)/30.4)))}</td></tr>`).join("")}</tbody></table></div>`:""; };
  ["c_start","c_end","c_total","c_freq","c_vat"].forEach(i=>$("#"+i).addEventListener("input",upd)); upd();
}
function readCon(c){ const o=Object.assign({},c,{category:$("#c_cat").value,branch:$("#c_branch").value.trim(),vendor:$("#c_vendor").value.trim(),refNo:$("#c_ref").value.trim(),startDate:$("#c_start").value,endDate:$("#c_end").value,totalAmount:parseFloat($("#c_total").value)||0,frequency:$("#c_freq").value,vatApplicable:$("#c_vat").value==="1",notes:$("#c_notes").value.trim(),
  landlord:Object.assign({},c.landlord||{},{name:$("#c_vendor").value.trim(),crNo:$("#c_lcr").value.trim(),vatNo:$("#c_lvat").value.trim(),iban:$("#c_liban").value.replace(/\s/g,""),phone:$("#c_phone").value.trim()}),
  property:Object.assign({},c.property||{},{ejarNo:$("#c_ref").value.trim(),deedNo:$("#c_deed").value.trim(),district:$("#c_dist").value.trim(),activity:$("#c_act").value.trim(),city:$("#c_city").value.trim(),areaSqm:parseFloat($("#c_area").value)||0,type:$("#c_ptype").value}),
  escalation:(()=>{ const t=$("#c_esc").value, v=parseFloat($("#c_escp").value)||0; return t==="none"?{type:"none"}:t==="fixed_amount"?{type:t,amount:v,every:"year"}:{type:t,pct:v,every:"year"}; })(),
  rentFree:$("#c_rff").value&&$("#c_rft").value?[{from:$("#c_rff").value,to:$("#c_rft").value}]:[],
  options:Object.assign({},c.options||{},{renewal:Object.assign({},((c.options||{}).renewal)||{},{years:parseFloat($("#c_ren").value)||0,noticeDays:parseInt($("#c_notice").value||"0",10)||0}),termination:Object.assign({},((c.options||{}).termination)||{},{penalty:parseFloat($("#c_tpen").value)||0})}),
  model:$("#c_model").value,ibr:parseFloat($("#c_ibr").value)||0,noticeDays:parseInt($("#c_notice").value||"0",10)||0,city:$("#c_city").value.trim(),propertyType:$("#c_ptype").value,areaSqm:parseFloat($("#c_area").value)||0,securityDeposit:parseFloat($("#c_dep").value)||0,landlordPhone:$("#c_phone").value.trim()}); delete o._id; return o; }
function payInstallment(cid,no){
  const c=S.contracts.find(x=>x.id===cid); const i=(c.installments||[]).find(x=>x.no===+no); if(!i) return;
  openModal(`Pay installment ${no} · ${c.branch}`,`<div class="calc"><div><span>Amount</span><b>${money(i.amount)}</b></div><div><span>VAT (input)</span><b>${money(i.vat)}</b></div><div><span>Total to bank</span><b>${money((+i.amount||0)+(+i.vat||0))}</b></div><div><span>Period</span><b>${fd(i.periodStart)} → ${fd(i.periodEnd)}</b></div></div>
   <div class="fgrid"><div class="field"><label for="p_date">Payment date</label><input id="p_date" type="date" value="${today()}"></div><div class="field"><label for="p_ref">Bank reference</label><input id="p_ref"></div></div>`,
   [{label:"Record payment",cls:"pri",fn:async()=>{ const o=Object.assign({},c); delete o._id; o.installments=c.installments.map(x=>x.no===+no?Object.assign({},x,{paidDate:$("#p_date").value,paymentRef:$("#p_ref").value.trim()}):x); await put("contracts",c.id,o); closeModal(); toast("Payment recorded"); }}]);
}

/* ---------- leases (portfolio, register, IFRS 16 / straight-line) ---------- */
const LZ=()=>window.Lease;
function leaseModel(c){ try{ return LZ()?LZ().resolveModel(c,settings()):"prepaid"; }catch(e){ return "prepaid"; } }
const MODEL_LBL={prepaid:"Prepaid",straightline:"Straight-line",ifrs16:"IFRS 16"};
function vLeases(){
  const st=settings(), t=today(), L=LZ();
  const leases=S.contracts.filter(c=>c.category==="Branch Rent");
  if(!L) return `<div class="warnbox">The lease engine did not load. Reload the page.</div>`;
  let pf={rows:[],totals:{}}; try{ pf=L.portfolio(leases,st,t)||pf; }catch(e){ console.error(e); }
  let mat=null; try{ mat=L.maturityAnalysis(leases,st,t); }catch(e){}
  const crit=[]; leases.forEach(c=>{ try{ (L.criticalDates(c,st,t)||[]).forEach(d=>crit.push(Object.assign({c},d))); }catch(e){} });
  const upcoming=crit.filter(d=>d.daysLeft!=null&&d.daysLeft<=120).sort((a,b)=>a.daysLeft-b.daysLeft);
  const rows=pf.rows||[]; const T=pf.totals||{};
  const next30=leases.reduce((a,c)=>a+(c.installments||[]).filter(i=>!i.paidDate&&i.dueDate>=t&&E.daysBetween(t,i.dueDate)<=30).reduce((x,i)=>x+(+i.amount||0)+(+i.vat||0),0),0);
  const overdue=leases.reduce((a,c)=>a+(c.installments||[]).filter(i=>!i.paidDate&&i.dueDate<t).reduce((x,i)=>x+(+i.amount||0)+(+i.vat||0),0),0);
  const annual=rows.reduce((a,r)=>a+(+r.annualCost||0),0);
  const months=[]; for(let i=0;i<24;i++) months.push(E.addMonths(E.monthStart(t),i));
  const byBranch={}; leases.forEach(c=>{ const v=months.map(m=>(c.installments||[]).filter(i=>!i.paidDate&&E.monthStart(i.dueDate)===m).reduce((x,i)=>x+(+i.amount||0)+(+i.vat||0),0)); byBranch[c.branch]=v; });
  // overdue goes into the current month bar
  leases.forEach(c=>{ const od=(c.installments||[]).filter(i=>!i.paidDate&&i.dueDate<months[0]).reduce((x,i)=>x+(+i.amount||0)+(+i.vat||0),0); if(od) byBranch[c.branch][0]+=od; });
  const names=Object.keys(byBranch).sort((a,b)=>byBranch[b].reduce((x,y)=>x+y,0)-byBranch[a].reduce((x,y)=>x+y,0));
  const cols=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)"];
  const series=names.slice(0,6).map((n,i)=>({label:n,color:cols[i],values:byBranch[n]}));
  if(names.length>6){ const o=months.map((_,i)=>names.slice(6).reduce((a,n)=>a+byBranch[n][i],0)); series.push({label:"Other branches",color:cols[6],values:o}); }
  const B=["≤1y","1–2y","2–3y","3–4y","4–5y",">5y"]; const mo=mat&&(mat.overall||mat.total||mat)||{};
  return `
  <div class="row" style="margin-bottom:14px"><div class="sub prose">Accounting model: <b>${h(MODEL_LBL[st.leaseStandard||"prepaid"]||"Prepaid")}</b> (change in Fees & Settings). Leases of 12 months or less always use the prepaid method.</div><span class="spacer"></span><button class="btn pri" data-act="addCon">New lease</button></div>
  <div class="kpis">
    <div class="kpi"><span class="tag"><i></i>Portfolio</span><span class="v">${leases.length}</span><span class="l">Active leases</span></div>
    <div class="kpi green"><span class="tag"><i></i>Commitment</span><span class="v">${money0(annual)}</span><span class="l">Annual cost (SAR)</span></div>
    <div class="kpi amber"><span class="tag"><i></i>Next 30 days</span><span class="v">${money0(next30)}</span><span class="l">Payments due incl. VAT</span></div>
    <div class="kpi red"><span class="tag"><i></i>Overdue</span><span class="v">${money0(overdue)}</span><span class="l">Unpaid past due incl. VAT</span></div>
    <div class="kpi blue"><span class="tag"><i></i>Critical dates</span><span class="v">${upcoming.filter(d=>/Notice|end/i.test(d.type)).length}</span><span class="l">Notice deadlines / ends ≤ 120 days</span></div>
    ${T.liability!=null&&T.liability>0?`<div class="kpi"><span class="tag"><i></i>IFRS 16</span><span class="v">${money0(T.liability)}</span><span class="l">Lease liability (SAR)</span></div>`:""}
  </div>
  ${rentalAnalyticsHtml(leases)}
  <div class="panel" style="margin-bottom:16px"><h2>Payment calendar — next 24 months <small>تقويم الدفعات</small></h2>${stackedBars(months,series,"Lease payments due per month by branch")}</div>
  <div class="grid2">
    <div class="panel"><h2>Critical dates <small>التواريخ الحرجة</small></h2>
      ${upcoming.length?upcoming.slice(0,10).map(d=>`<div class="alert s-${d.daysLeft<0?"expired":d.daysLeft<=30?"critical":d.daysLeft<=60?"warning":"notice"}"><span class="stripe"></span><div style="min-width:0"><div class="t">${h(d.type)} ${sevPill(d.daysLeft<0?"expired":d.daysLeft<=30?"critical":"warning",d.daysLeft<0?Math.abs(d.daysLeft)+"d overdue":d.daysLeft+"d")}</div><div class="m">${h(d.c.branch)} · ${fd(d.date)} · ${h(hj(d.date))}</div></div><div class="row"><button class="btn sm" data-lease="${h(d.c.id)}">Open</button></div></div>`).join(""):`<div class="empty"><b>Nothing in the next 120 days</b></div>`}
    </div>
    <div class="panel"><h2>Maturity analysis <small>تحليل الاستحقاقات</small></h2>
      <div class="sub" style="margin-bottom:8px">Undiscounted unpaid lease payments, excl. VAT (IFRS 16.58)</div>
      <div class="tbl-wrap"><table><thead><tr>${B.map(b=>`<th class="n">${h(b)}</th>`).join("")}<th class="n">Total</th></tr></thead><tbody><tr>${B.map(b=>`<td class="n">${money0(mo[b])}</td>`).join("")}<td class="n"><b>${money0(mo.total)}</b></td></tr></tbody></table></div>
    </div>
  </div>
  <div class="panel" style="padding:0"><div style="padding:16px 18px 0"><h2>Lease register <small>سجل عقود الإيجار</small></h2></div>
   <div class="tbl-wrap only-desk" style="border:0;border-radius:0 0 14px 14px"><table><thead><tr><th>Lease</th><th>Branch</th><th>Model</th><th>Term</th><th class="n">Monthly cost</th><th class="n">Annual cost</th><th>Next payment</th><th class="n">Overdue</th><th>Notice deadline</th>${T.liability>0?`<th class="n">Liability</th><th class="n">ROU NBV</th>`:""}</tr></thead><tbody>
   ${rows.map(r=>`<tr class="clk" data-lease="${h(r.id)}"><td class="mono">${h(r.id)}</td><td>${h(r.branch)}</td><td><span class="pill p-grey">${h(MODEL_LBL[r.model]||r.model)}</span></td><td>${h(r.termMonths)} m<div class="sub">${h(r.remainingMonths)} m left</div></td><td class="n">${money(r.monthlyCost)}</td><td class="n">${money(r.annualCost)}</td><td>${r.nextPayment&&r.nextPayment.date?`${fd(r.nextPayment.date)}<div class="sub mono">${money(r.nextPayment.amount)}</div>`:"—"}</td><td class="n">${r.overdueAmount?`<span style="color:var(--red)">${money(r.overdueAmount)}</span>`:"—"}</td><td>${r.noticeDeadline?`${fd(r.noticeDeadline)}<div>${daysPill(E.daysBetween(t,r.noticeDeadline))}</div>`:"—"}</td>${T.liability>0?`<td class="n">${r.liability!=null?money(r.liability):"—"}</td><td class="n">${r.rouNbv!=null?money(r.rouNbv):"—"}</td>`:""}</tr>`).join("")}
   </tbody></table></div>
   <div class="mlist only-mob" style="padding:0 12px 12px">${rows.map(r=>`<button class="mcard" data-lease="${h(r.id)}"><span class="t">${h(r.branch)}</span><span class="r"><span class="pill p-grey">${h(MODEL_LBL[r.model]||r.model)}</span></span><span class="s"><span>${money0(r.monthlyCost)} SAR / month</span>${r.nextPayment&&r.nextPayment.date?`<span>next ${fd(r.nextPayment.date)}</span>`:""}${r.overdueAmount?`<span style="color:var(--red)">overdue ${money0(r.overdueAmount)}</span>`:""}</span></button>`).join("")}</div>
  </div>`;
}
function openLease(id){
  const c=S.contracts.find(x=>x.id===id); if(!c) return; const st=settings(), t=today(), L=LZ(); const model=leaseModel(c);
  let sched=null, sl=null; try{ if(model==="ifrs16") sched=L.ifrs16(c,st); else sl=L.straightLine(c,t); }catch(e){ console.error(e); }
  const inst=c.installments||[];
  const instRows=inst.map(i=>`<tr><td class="mono">${i.no}</td><td>${fd(i.dueDate)}</td><td>${fd(i.periodStart)} → ${fd(i.periodEnd)}</td><td class="n">${money(i.amount)}</td><td class="n">${money(i.vat)}</td><td>${i.paidDate?`<span class="pill p-green">Paid ${fd(i.paidDate)}</span>`:`<button class="btn sm pri" data-payinst="${h(c.id)}|${i.no}">Record payment</button>`}</td></tr>`).join("");
  const schedHtml = sched?`<div class="calc"><div><span>PV at commencement</span><b>${money(sched.pv)}</b></div><div><span>Right-of-use asset</span><b>${money(sched.rouInitial)}</b></div><div><span>Incremental borrowing rate</span><b>${((sched.ibr||0)*100).toFixed(2)}%</b></div><div><span>Liability today</span><b>${money(L.liabilityAt(c,st,t))}</b></div><div><span>Current portion</span><b>${money(L.currentPortion(c,st,t))}</b></div></div>
    <div class="tbl-wrap" style="max-height:340px"><table><thead><tr><th>Month</th><th class="n">Opening liability</th><th class="n">Interest</th><th class="n">Payments</th><th class="n">Closing liability</th><th class="n">Depreciation</th><th class="n">ROU NBV</th></tr></thead><tbody>${(sched.months||[]).map(m=>`<tr><td>${mLong(m.month)}</td><td class="n">${money(m.openingLiab)}</td><td class="n">${money(m.interest)}</td><td class="n">${money(m.payments)}</td><td class="n">${money(m.closingLiab)}</td><td class="n">${money(m.depreciation)}</td><td class="n">${money(m.rouNbv)}</td></tr>`).join("")}</tbody></table></div>`
    : sl?`<div class="calc"><div><span>Daily expense</span><b>${money(sl.dailyExpense)}</b></div><div><span>Monthly cost (avg)</span><b>${money(sl.dailyExpense*30.4375)}</b></div><div><span>Expense to date</span><b>${money(sl.expenseToDate)}</b></div><div><span>Paid to date</span><b>${money(sl.paidToDate)}</b></div><div><span>${sl.balance>=0?"Prepaid rent":"Accrued rent"}</span><b>${money(Math.abs(sl.balance))}</b></div></div>`:"";
  let crit=[]; try{ crit=L.criticalDates(c,st,t)||[]; }catch(e){}
  openModal(`${c.branch} · ${c.id}`,`
    <div class="row" style="gap:8px">${[["Landlord",c.vendor],["Ejar contract no",c.refNo],["City",c.city],["Property type",c.propertyType],["Area (m²)",c.areaSqm],["Accounting model",MODEL_LBL[model]]].filter(x=>x[1]).map(([l,v])=>`<span class="pill p-grey">${h(l)}: ${h(v)}</span>`).join("")}</div>

/* loans & advances */
function loanBalance(l){ if(l.status==="CLOSED") return 0; const paid=(l.repayments||[]).reduce((a,x)=>a+(+x.amount||0),0); const t=today(); let sched=0;
  if(l.startPeriod&&+l.monthly>0){ const [y,m]=l.startPeriod.split("-").map(Number); const [ty,tm]=t.slice(0,7).split("-").map(Number); const n=Math.max(0,(ty-y)*12+(tm-m)+(t.slice(8)>="25"?1:0)); sched=Math.min(+l.amount||0,n*(+l.monthly)); }
  return Math.max(0,Math.round(((+l.amount||0)-Math.max(sched,paid))*100)/100); }

function openHrImport(){
  if(!window.XLSX){ toast("The Excel reader did not load."); return; }
  openModal("Import salaries & HR data · استيراد الرواتب",`<div class="sub prose">One row per employee. Columns are matched by name (Arabic or English): Emp No / HR No / Iqama No to find the employee, then any of: basic, housing, transport, other allowances, hire date, IBAN, bank, GOSI number, contract end, leave balance.</div><div class="field"><label for="hi_file">Excel file</label><input id="hi_file" type="file" accept=".xlsx,.xls,.csv"></div><div id="hi_area"></div>`,[]);
  $("#hi_file").addEventListener("change",async ev=>{ const f=ev.target.files[0]; if(!f) return;
    try{ const wb=IO.readWorkbook(await f.arrayBuffer()); const sh=wb.sheets[0];
      const norm=s=>String(s||"").toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/[^a-z0-9؀-ۿ]/g,"");
      const SYN={empNo:["empno","employeeno","رقمالموظفالالي"],hrNo:["hrno","staffno","الرقمالوظيفي","الرقمالوظيفى"],iqamaNo:["iqama","iqamano","رقمالاقامه","رقمالهويه","id"],basic:["basic","basicsalary","الراتبالاساسي","الاساسي","راتباساسي"],housing:["housing","housingallowance","بدلالسكن","السكن"],transport:["transport","transportation","بدلالنقل","بدلمواصلات","النقل","المواصلات"],otherAllow:["other","otherallowances","بدلاتاخري","اخري"],hireDate:["hiredate","joiningdate","startdate","تاريخالتعيين","تاريخالمباشره","تاريخالالتحاق"],iban:["iban","الايبان","رقمالايبان","الحسابالبنكي"],bankName:["bank","bankname","البنك","اسمالبنك"],gosiRegNo:["gosi","gosino","رقمالتامينات"],contractEnd:["contractend","نهايهالعقد"],annualLeaveOpening:["leavebalance","رصيدالاجازه","رصيدالاجازات"]};
      const map={}; sh.headers.forEach((hd,i)=>{ const n=norm(hd); for(const k in SYN){ if(map[k]==null&&SYN[k].some(s=>n===s||n.includes(s))){ map[k]=i; break; } } });
      const rows=[]; const miss=[]; sh.rows.forEach((r,ri)=>{ const key=k=>map[k]!=null?String(r[map[k]]==null?"":r[map[k]]).trim():"";
        const e=S.employees.find(x=>(key("empNo")&&x.empNo===key("empNo"))||(key("hrNo")&&x.hrNo===key("hrNo").replace(/\.0$/,""))||(key("iqamaNo")&&(x.iqamaNo===key("iqamaNo").replace(/\D/g,"")||x.nationalId===key("iqamaNo").replace(/\D/g,""))));
        if(!e){ if(r.some(c=>c!==""&&c!=null)) miss.push(ri+2); return; }
        const hr={}; ["basic","housing","transport","otherAllow","annualLeaveOpening"].forEach(k=>{ if(map[k]!=null&&r[map[k]]!==""&&r[map[k]]!=null) hr[k]=parseFloat(String(r[map[k]]).replace(/,/g,""))||0; });
        ["hireDate","contractEnd"].forEach(k=>{ if(map[k]!=null){ const d=IO.parseDate(r[map[k]]); if(d) hr[k]=d; } });
        ["iban","bankName","gosiRegNo"].forEach(k=>{ if(map[k]!=null&&r[map[k]]) hr[k]=String(r[map[k]]).replace(/\s/g,k==="iban"?"":" ").trim(); });
        if(Object.keys(hr).length) rows.push({e,hr}); });
      $("#hi_area").innerHTML=`<div class="okbox">Matched columns: ${Object.keys(map).map(k=>`<b>${h(k)}</b> ← ${h(sh.headers[map[k]])}`).join(" · ")||"none"}</div><div class="okbox" style="margin-top:8px"><b>${rows.length}</b> employees will be updated.${miss.length?` ${miss.length} rows did not match any employee (rows ${miss.slice(0,15).join(", ")}${miss.length>15?"…":""}).`:""}</div><div class="row" style="margin-top:10px"><button class="btn pri" id="hi_go" ${rows.length?"":"disabled"}>Update ${rows.length} employees</button><span id="hi_p" class="sub"></span></div>`;
      $("#hi_go").addEventListener("click",async()=>{ $("#hi_go").disabled=true; let n=0; for(const {e,hr} of rows){ const o=Object.assign({},e,{hr:Object.assign({},e.hr||{},hr)}); delete o._id; try{ await put("employees",e.empNo,o); }catch(x){} n++; $("#hi_p").textContent=`${n} / ${rows.length}`; } closeModal(); toast(`Updated ${n} employees`); });
    }catch(x){ $("#hi_area").innerHTML=`<div class="warnbox">This file could not be read: ${h(x.message||x)}</div>`; } });
}

const AM_KEYS=[["iqamaExp","Iqama fees","var(--s1)"],["levyExp","Expat levy","var(--s2)"],["wpExp","Work permit","var(--s3)"],["depExp","Dependents","var(--s4)"],["rentExp","Branch rent","var(--s5)"],["insExp","Medical insurance","var(--s6)"],["otherPrepaidExp","Other prepaid","var(--s7)"]];
function amSeries(sch,cat,rows){
  const n=sch.months.length;
  if(cat==="Branch Rent"){ // one series per branch, max 7 then "Other"
    const by={}; rows.forEach(r=>{ const b=r.item.branch||r.item.label; by[b]=by[b]||new Array(n).fill(0); r.byMonth.forEach((v,i)=>by[b][i]+=v||0); });
    const names=Object.keys(by).sort((a,b)=>by[b].reduce((x,y)=>x+y,0)-by[a].reduce((x,y)=>x+y,0));
    const cols=["var(--s1)","var(--s2)","var(--s3)","var(--s4)","var(--s5)","var(--s6)","var(--s7)"];
    const out=names.slice(0,6).map((b,i)=>({label:b,color:cols[i],values:by[b]}));
    if(names.length>6){ const o=new Array(n).fill(0); names.slice(6).forEach(b=>by[b].forEach((v,i)=>o[i]+=v)); out.push({label:"Other branches",color:cols[6],values:o}); }
    return out;
  }
  const acc={}; AM_KEYS.forEach(([k])=>acc[k]=new Array(n).fill(0));
  rows.forEach(r=>{ const sp=r.item.split||{}; const tot=Object.values(sp).reduce((a,v)=>a+(+v||0),0)||1; Object.keys(sp).forEach(k=>{ if(!acc[k]) acc[k]=new Array(n).fill(0); r.byMonth.forEach((v,i)=>acc[k][i]+=(v||0)*(+sp[k]||0)/tot); }); });
  return AM_KEYS.filter(([k])=>acc[k].some(v=>v>0.004)).map(([k,l,c])=>({label:l,color:c,values:acc[k]}));
}

function fullJournal(month){
  const st=settings(), t=today(); const j=E.monthlyJournal(stateP(),st,month,t);
  try{ if(LZ()){ const lj=LZ().leaseJournal(S.contracts.filter(c=>c.category==="Branch Rent"&&leaseModel(c)!=="prepaid"),st,month,t); if(lj&&lj.entries&&lj.entries.length){ j.entries=j.entries.concat(lj.entries); j.balanced=j.balanced&&lj.balanced!==false; } } }catch(e){ console.error(e); }
  try{ if(window.Rental){ const dj=window.Rental.depositsJournal(S.contracts,month,settings()); if(dj&&dj.entries&&dj.entries.length){ j.entries=j.entries.concat(dj.entries); j.balanced=j.balanced&&dj.balanced!==false; } } }catch(e){ console.error(e); }
  try{ const H=HRX(); if(H){ const pid=month.slice(0,7); const sv=S.payruns.find(r=>r.id===pid);
      if(sv&&sv.status==="LOCKED"&&sv.run){ const pj=H.payrollJournal(sv.run,hrCfg()); j.entries=j.entries.concat(pj.entries||[]); j.balanced=j.balanced&&pj.balanced!==false; }
      const emps=activeStaff().filter(e=>e.hr&&e.hr.hireDate&&hasPay(e));

  return j;
}

async function runImport(dd,gen){
  const btn=$("#imp_go"); btn.disabled=true; const prog=$("#imp_prog"); let done=0; const total=dd.toCreate.length+dd.toUpdate.length;
  await withNumberLock(async()=>{
    const ids=S.employees.map(e=>e.empNo); const pre=settings().empPrefix||"EMP-", pad=settings().empPad||4;
    const jobs=[];
    dd.toCreate.forEach(e=>{ const o=Object.assign({status:"Active",depPayer:"Employee",dependents:0},e);
      if(gen||!o.empNo||ids.includes(o.empNo)){ if(o.empNo&&gen) o.oldEmpNo=o.empNo; o.empNo=E.nextNumber(ids,pre,pad); }
      ids.push(o.empNo); o.createdAt=new Date().toISOString(); jobs.push(["employees",o.empNo,o]); });
    dd.toUpdate.forEach(u=>{ const cur=empBy(u.empNo); if(cur){ const o=Object.assign({},cur,u.changes); delete o._id; jobs.push(["employees",u.empNo,o]); } });
    let i=0; const worker=async()=>{ while(i<jobs.length){ const j=jobs[i++]; for(let a=0;a<4;a++){ try{ await put(...j); break; }catch(e){ if(e&&e.code==="resource_exhausted"){ await new Promise(r=>setTimeout(r,800*(a+1))); } else if(a===3||!(e&&e.code==="unavailable")) break; } } done++; prog.textContent=`${done} / ${total} saved`; } };
    await Promise.all([worker(),worker(),worker(),worker()]);
  });
  toast(`Import finished: ${done} records`); closeModal(); go("employees");
}
